async function loadCustomFont(f){
  if(customFontState.loaded.has(f.id) || customFontState.loading.has(f.id) || !state.key || !window.FontFace) return;
  customFontState.loading.add(f.id);
  try{
    const file = await getFile(state.repo, state.token, f.path);
    if(file.status !== 200) throw new Error("absent");
    const bytes = await decryptAny(file.bytes);
    const face = new FontFace("cf-" + f.id, bytes.buffer, f.noDigits ? {unicodeRange: "U+0000-002F, U+003A-10FFFF", display: "swap"} : {display: "swap"});
    await face.load(); document.fonts.add(face); customFontState.loaded.add(f.id);
  }catch(e){} finally { customFontState.loading.delete(f.id); }
}
const FONT_EXT = /\.(ttf|otf|woff2?)$/i;
function isFontBytes(b){
  if(!b || b.length < 4) return false;
  const tag = String.fromCharCode(b[0], b[1], b[2], b[3]);
  return tag === "wOF2" || tag === "wOFF" || tag === "OTTO" || tag === "true" || (b[0] === 0 && b[1] === 1 && b[2] === 0 && b[3] === 0);
}
async function inflateRaw(bytes){
  if(!window.DecompressionStream) throw new Error("Ton navigateur ne sait pas ouvrir les zip : importe directement le fichier .ttf ou .otf.");
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzipFonts(buf){
  const b = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for(let i = b.length - 22; i >= Math.max(0, b.length - 65557); i--){ if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; } }
  if(eocd < 0) throw new Error("Ce zip semble abîmé.");
  const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const out = [];
  for(let n = 0; n < count; n++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(b.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + xlen + clen;
    const base = name.split("/").pop();
    if(!FONT_EXT.test(base) || /(^|\/)(__MACOSX|\.)/.test(name) || base.startsWith(".")) continue;
    const ds = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    const raw = b.subarray(ds, ds + csize);
    const data = method === 0 ? raw.slice() : method === 8 ? await inflateRaw(raw) : null;
    if(data && isFontBytes(data)) out.push({name: base, bytes: data});
  }
  return out;
}
function prettyFontName(file){
  return file.replace(FONT_EXT, "").replace(/[-_]+/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").replace(/\b(demo|personal use|free|trial)\b/gi, "").replace(/\s+/g, " ").trim().replace(/\b\w/g, c => c.toUpperCase()) || "Ma police";
}
/* Les polices de démo remplacent souvent les chiffres par un logo : on le repère en comparant « 0 » et « 7 » */
async function digitsAreWatermark(bytes){
  try{
    const fam = "cftest" + uid().replace(/\W/g, "");
    const face = new FontFace(fam, bytes.slice().buffer); await face.load(); document.fonts.add(face);
    const draw = ch => { const c = document.createElement("canvas"); c.width = 120; c.height = 60; const x = c.getContext("2d"); x.font = '40px "' + fam + '"'; x.fillText(ch, 4, 44); return {w: Math.round(x.measureText(ch).width), d: c.toDataURL()}; };
    const a = draw("0"), z = draw("7"), m = draw("M");
    document.fonts.delete(face);
    return a.d === z.d || (a.w === z.w && a.w > m.w * 1.6);
  }catch(e){ return false; }
}
async function importFonts(files, progress){
  let fonts = [];
  for(const file of files){
    const buf = await file.arrayBuffer();
    if(/\.zip$/i.test(file.name) || new Uint8Array(buf.slice(0, 2))[0] === 0x50) fonts = fonts.concat(await unzipFonts(buf));
    else { const u = new Uint8Array(buf); if(isFontBytes(u)) fonts.push({name: file.name, bytes: u}); }
  }
  if(!fonts.length) throw new Error("Aucune police trouvée : il faut un fichier .ttf, .otf, .woff, .woff2 ou un zip qui en contient.");
  const added = [];
  for(const f of fonts){
    if(f.bytes.length > 4 * 1024 * 1024){ continue; }
    progress("Envoi de « " + prettyFontName(f.name) + " »…");
    const id = uid().replace(/\W/g, "").slice(0, 12);
    const path = "fonts/" + id + ".enc";
    const noDigits = await digitsAreWatermark(f.bytes);
    await putFile(state.repo, state.token, path, await encryptBytes(state.key, f.bytes), null, "police");
    added.push({id, name: prettyFontName(f.name), path, noDigits});
  }
  if(!added.length) throw new Error("Ces fichiers sont trop lourds (plus de 4 Mo).");
  await W.setSettings({customFonts: [...(state.settings.customFonts || []), ...added]});
  return added;
}

/* ---------- Changement du mot de passe : tout est rechiffré avec la nouvelle clé ---------- */
function pwStrength(pw){
  const words = pw.trim().split(/[\s\-_.,;:+]+/).filter(w => w.length >= 3).length;
  const classes = [/[a-z]/, /[A-Z]/, /\d/, /[^\w\s]/].filter(r => r.test(pw)).length;
  if(pw.length < 14) return {ok:false, level:0, label:"Trop court : au moins 14 caractères."};
  if(words >= 4 || pw.length >= 24 || (pw.length >= 18 && classes >= 3)) return {ok:true, level:3, label:"Solide ♡"};
  if(words >= 3 || pw.length >= 18) return {ok:true, level:2, label:"Correct. Encore un mot et il sera solide."};
  return {ok:true, level:1, label:"Passable. Mieux : 4 mots au hasard séparés par des tirets."};
}
async function listPhotoFiles(){
  const res = await gh(state.repo, state.token, "/contents/photos?ref=" + DATA_BRANCH);
  if(res.status === 404) return [];
  if(!res.ok) throw new GhError(res.status);
  const j = await res.json();
  return (Array.isArray(j) ? j : []).filter(f => f.type === "file" && /\.enc$/.test(f.name)).map(f => f.path);
}
async function changePassword(current, next, progress){
  const oldKey = await deriveKeyCfg(current, state.config);
  try{ await decryptBytes(oldKey, unb64(state.config.token)); }catch(e){ throw new Error("Le mot de passe actuel n'est pas le bon."); }
  let pend = null; try{ pend = JSON.parse(LS.get(storeKey("pwchange")) || "null"); }catch(e){}
  if(!pend || !pend.salt){ pend = {salt: b64(crypto.getRandomValues(new Uint8Array(16)))}; LS.set(storeKey("pwchange"), JSON.stringify(pend)); }
  progress("Préparation de la nouvelle clé…");
  const newCfgBase = newKdfConfig(pend.salt);
  const newKey = await deriveKeyCfg(next, newCfgBase);
  state.rotating = true; state.altKey = newKey;
  try{
    while(state.busy || state.pending.length) await new Promise(r => setTimeout(r, 200));
    const paths = await listPhotoFiles();
    let done = 0, skipped = 0;
    for(const path of paths){
      progress("Photos : " + done + " / " + paths.length);
      const f = await getFile(state.repo, state.token, path);
      if(f.status === 200){
        let ok = false;
        try{ await decryptBytes(newKey, f.bytes); ok = true; }catch(e){}
        if(!ok){
          let plain = null;
          try{ plain = await decryptBytes(oldKey, f.bytes); }catch(e){ skipped++; }
          if(plain) await putFile(state.repo, state.token, path, await encryptBytes(newKey, plain), f.sha, "rechiffrement");
        }
      }
      done++;
    }
    progress("Textes et réglages…");
    const f = await getFile(state.repo, state.token, DATA_PATH);
    let data;
    try{ data = await decryptJSON(newKey, f.bytes); }catch(e){ data = await decryptJSON(oldKey, f.bytes); }
    state.sha = await putFile(state.repo, state.token, DATA_PATH, await encryptJSON(newKey, data), f.sha, "rechiffrement");
    state.data = data; state.etag = null; syncFromData();
    progress("Nouvelle serrure…");
    const cur = await getFile(state.repo, state.token, CONFIG_PATH);
    const cfg = {...state.config, v: 2, ...newCfgBase, token: b64(await encryptBytes(newKey, TE.encode(state.token)))};
    delete cfg.iter;
    state.configSha = await putFile(state.repo, state.token, CONFIG_PATH, TE.encode(JSON.stringify(cfg, null, 2)), cur.status === 200 ? cur.sha : null, "nouveau mot de passe");
    state.config = cfg; state.key = newKey; state.altKey = oldKey;
    if(LS.get(storeKey("key"))) LS.set(storeKey("key"), b64(new Uint8Array(await crypto.subtle.exportKey("raw", newKey))));
    LS.del(storeKey("pwchange"));
    return {photos: paths.length, skipped};
  } finally { state.rotating = false; }
}

      try{ const added = await importFonts(files, t => { fmsg.textContent = t; }); toast(added.length > 1 ? added.length + " polices ajoutées ♡" : "Police « " + added[0].name + " » ajoutée ♡"); state.previewLook = false; closeModal(); reglagesForm(); }
      catch(err){ fmsg.textContent = err.status === 401 ? "La clé GitHub ne fonctionne plus." : (err.message && !/^\d+$/.test(err.message) ? err.message : "L'envoi a échoué, réessaie."); ff.disabled = false; ff.value = ""; }
    });
    sheet.querySelector(".myfonts").addEventListener("click", e => {
      const x = e.target.closest("[data-delfont]"); if(!x) return;
      if(x.dataset.armed !== "1"){ x.dataset.armed = "1"; x.textContent = "Retirer ?"; x.classList.add("armed"); setTimeout(() => { if(x.isConnected){ x.dataset.armed = ""; x.textContent = "×"; x.classList.remove("armed"); } }, 3000); return; }
      const id = x.dataset.delfont;
      W.setSettings({customFonts: (state.settings.customFonts || []).filter(f => f.id !== id)}).catch(() => {});
      state.previewLook = false; closeModal(); reglagesForm(); toast("Police retirée.");
    });
    const colBox = sheet.querySelector("#r-colors");
    const drawColors = () => { colBox.innerHTML = COLOR_FIELDS.map(([k, label]) => '<label class="colorfield"><input type="color" data-col="'+k+'" value="'+look.colors[k]+'"><span>'+esc(label)+'</span></label>').join(""); };
    drawColors();
    colBox.addEventListener("input", e => { const k = e.target.dataset.col; if(!k) return; look.colors[k] = e.target.value; preview(); });
    sheet.querySelector("#r-presets").innerHTML = COLOR_PRESETS.map((p, i) => chip(p.colors, p.name, 'data-preset="'+i+'"') + '</span>').join("");
    sheet.querySelector("#r-presets").addEventListener("click", e => { const b = e.target.closest("[data-preset]"); if(!b) return; look.colors = {...COLOR_PRESETS[+b.dataset.preset].colors}; drawColors(); preview(); });
    const mine = sheet.querySelector("#r-mine");
    const drawMine = () => {
      const list = Array.isArray(state.settings.savedThemes) ? state.settings.savedThemes : [];
      mine.innerHTML = list.length ? list.map((t, i) => chip(t.colors, t.name, 'data-mine="'+i+'"') + '<button type="button" class="themechip-x" data-delmine="'+i+'" aria-label="Supprimer le thème '+esc(t.name)+'">×</button></span>').join("") : '<span class="help">Aucun pour l\'instant. Règle les couleurs puis enregistre-les ici.</span>';
    };
    drawMine();
    mine.addEventListener("click", e => {
      const list = state.settings.savedThemes || [];
      const d = e.target.closest("[data-delmine]");
      if(d){ const name = (list[+d.dataset.delmine] || {}).name; W.setSettings({savedThemes: list.filter((_, i) => i !== +d.dataset.delmine)}).catch(() => {}); toast("Thème « "+name+" » supprimé."); setTimeout(drawMine, 50); return; }
      const b = e.target.closest("[data-mine]"); if(!b) return;
      const t = list[+b.dataset.mine]; if(!t) return; look.colors = {...COLOR_PRESETS[0].colors, ...t.colors}; drawColors(); preview();
    });
    sheet.querySelector("#r-tsave").addEventListener("click", () => {
      const inp = sheet.querySelector("#r-tname"); const name = inp.value.trim() || ("Thème " + ((state.settings.savedThemes || []).length + 1));
      const list = (state.settings.savedThemes || []).filter(t => t.name !== name).concat([{name, colors: {...look.colors}}]);
      W.setSettings({savedThemes: list}).catch(() => {}); inp.value = ""; toast("Thème « "+name+" » enregistré."); setTimeout(drawMine, 50);
    });
    const size = sheet.querySelector("#r-size");
    size.addEventListener("input", () => { look.fontScale = +size.value; sheet.querySelector("#r-size-v").textContent = Math.round(look.fontScale*100) + " %"; preview(); });
    loadAllFonts();
    sheet.addEventListener("click", e => {
      const btn = e.target.closest(".fp-btn");
      if(btn){
        const list = btn.nextElementSibling, open = list.hidden;
        sheet.querySelectorAll(".fp-list").forEach(l => { l.hidden = true; l.previousElementSibling.setAttribute("aria-expanded", "false"); });
        list.hidden = !open; btn.setAttribute("aria-expanded", String(open));
        if(open){ const cur = list.querySelector('[aria-selected="true"]'); if(cur) cur.scrollIntoView({block:"nearest"}); }
        return;
      }
      const opt = e.target.closest(".fp-opt");
      if(opt){
        const box = opt.closest(".fpick"), key = box.dataset.key, f = FONTS[box.dataset.group][opt.dataset.f];
        look[key] = opt.dataset.f;
        box.querySelectorAll(".fp-opt").forEach(o => o.setAttribute("aria-selected", String(o === opt)));
        const b = box.querySelector(".fp-btn"); b.querySelector("span").textContent = f.label; b.querySelector("span").style.fontFamily = f.css || "inherit";
        opt.parentElement.hidden = true; b.setAttribute("aria-expanded", "false");
        preview(); return;
      }
      if(!e.target.closest(".fpick")) sheet.querySelectorAll(".fp-list").forEach(l => { l.hidden = true; });
    });
    const overlay = sheet.closest(".overlay");
    sheet.querySelector("#r-cancel").addEventListener("click", () => { closeModal(); revert(); });
    overlay.addEventListener("click", e => { if(e.target === overlay) revert(); }, true);
    sheet.querySelector("#regForm").addEventListener("submit", e => {
      e.preventDefault(); state.previewLook = false;
      W.setSettings({...look, tmdbKey: sheet.querySelector("#r-tmdb").value.trim()}).catch(() => {});
      closeModal();
    });
  });
}

/* ---------- Clics ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act;
  if(el.tagName === "A" && el.getAttribute("href") === "#") e.preventDefault();
  if(act === "close-bg"){ if(e.target === el) closeModal(); return; }
  if(act === "close"){ closeModal(); return; }
  if(act === "reload"){ location.reload(); return; }
  if(act === "iam"){ state.me = el.dataset.n; LS.set(storeKey("me"), state.me); state.phase = "app"; state.route = parseHash(); render(); return; }
  if(state.phase !== "app") return;
  if(["home","open-domain","open-list","open-fav"].includes(act)) e.preventDefault();
  if(act === "home"){ go({page:"home"}); return; }
  if(act === "open-domain"){ go({page:"domain", id:el.dataset.id}); return; }
  if(act === "open-list"){ go({page:"list", id:el.dataset.id}); return; }
  if(act === "fav-all"){ const open = el.dataset.open === "1"; state.favOpen = new Set(open ? [...document.querySelectorAll(".favgroup")].map(d => d.dataset.fav) : []); render(); return; }
  if(act === "open-fav"){ go({page:"fav"}); return; }
  if(act === "open-gifts"){ e.preventDefault(); go({page:"gifts"}); return; }
  if(act === "open-watch"){ e.preventDefault(); go({page:"watch"}); return; }
  if(act === "scroll-domains"){ e.preventDefault(); const t = document.getElementById("domaines"); if(t) t.scrollIntoView({behavior:"smooth"}); return; }
  if(act === "day"){ openDay(+el.dataset.t); return; }
  if(act === "show-item"){ const it = state.items.find(i => i.id === el.dataset.id); if(it) openModal('<div class="modal-wall">'+wallHTML([it], "fav")+'</div><div class="sheet-actions"><button class="btn" data-act="close">Fermer</button></div>'); return; }
  if(act === "mood"){ const m = el.dataset.m; state.mood = (!m || state.mood === m) ? null : m; render(); return; }
  if(act === "add"){ if(!state.cats.length){ toast("Crée d'abord un domaine."); domainForm(null); } else itemForm(null); return; }
  if(act === "edit"){ const it = state.items.find(i => i.id === el.dataset.id); if(it) itemForm(it); return; }
  if(act === "fav"){ const it = state.items.find(i => i.id === el.dataset.id); if(it) W.setFav(it.id, state.me, !(it.favBy||[]).includes(state.me)).catch(() => {}); return; }
  if(act === "add-photo"){ itemForm(null, {cat: catById("nous") ? "nous" : (sortedCats()[0]||{}).id, pickPhoto: true}); return; }
  if(act === "unwrap"){
    const id = el.dataset.id, card = el.closest(".card");
    const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(card) card.classList.add("unwrapping");
    setTimeout(() => {
      state.justOpened = state.justOpened || new Set(); state.justOpened.add(id);
      W.unwrap(id, state.me).catch(() => {});
      setTimeout(() => { state.justOpened.delete(id); }, 1500);
    }, reduce ? 0 : 520);
    return;
  }
  if(act === "capy"){ el.classList.add("found"); toast("Tu as trouvé le capybara. Il te souhaite une très bonne journée."); return; }
  if(act === "new-domain"){ domainForm(null); return; }
  if(act === "edit-domain"){ domainForm(catById(el.dataset.id)); return; }
  if(act === "new-list"){ if(state.route.page === "domain") listForm(null, state.route.id); return; }
  if(act === "edit-list"){ const l = listById(el.dataset.id); if(l) listForm(l); return; }
  if(act === "settings"){ settingsForm(); return; }
  if(act === "reglages"){ reglagesForm(); return; }
  if(act === "notifs-read"){ markNotifsRead(); render(); return; }
  if(act === "notifs-all"){ e.preventDefault && e.preventDefault(); notifsModal(); return; }
  if(act === "trailer"){ const it = state.items.find(i => i.id === el.dataset.id); if(it){ el.disabled = true; el.textContent = "Je cherche…"; playTrailer(it).finally(() => { if(el.isConnected){ el.disabled = false; el.textContent = "▶ Bande-annonce"; } }); } return; }
  if(act === "tt-play"){ const it = state.items.find(i => i.id === el.dataset.id); if(it) playTikTok(it); return; }
  if(act === "change-pw"){ passwordForm(); return; }
  if(act === "rich-more"){ const card = el.closest(".card"); if(card){ const open = card.classList.toggle("rich-open"); el.textContent = open ? "Replier" : "Lire tout"; } return; }
  if(act === "intro-toggle"){ state.introOpen = !state.introOpen; if(state.introOpen) markIntroRead(); render(); return; }
  if(act === "intro-edit"){ state.editIntro = true; render(); const i = document.getElementById("i-sub"); if(i) i.focus(); return; }
  if(act === "intro-cancel"){ state.editIntro = false; render(); return; }
  if(act === "switch-me"){ state.phase = "who"; renderGate(); return; }
  if(act === "logout"){ LS.del(storeKey("key")); state.key = null; state.token = null; state.data = null; state.phase = "login"; history.replaceState(null, "", location.pathname); renderGate(); return; }
  if(act === "replies"){
    const k = el.dataset.key; state.openReplies.has(k) ? state.openReplies.delete(k) : state.openReplies.add(k);
    render(); const inp = document.getElementById("reply-"+k.replace(":","-")); if(inp) inp.focus(); return;
  }
});
document.addEventListener("change", e => {
  const cb = e.target.closest && e.target.closest("input[data-seen]");
  if(!cb || state.phase !== "app") return;
  W.setSeen(cb.dataset.seen, state.me, cb.checked).catch(() => {});
});
document.addEventListener("keydown", e => { if(e.key === "Escape"){ closeModal(); if(state.previewLook){ state.previewLook = false; render(); } } });

/* ---------- Glisser-déposer ---------- */
function clearMarks(){ document.querySelectorAll(".drop-before,.drop-after,.drop-in").forEach(n => n.classList.remove("drop-before","drop-after","drop-in")); }
function parseRef(s){ const i = (s||"").indexOf(":"); return i < 0 ? {type:s} : {type:s.slice(0,i), id:s.slice(i+1)}; }
function dropMode(src, tgt){
  if(!src || !tgt) return null;
  if(src.type === "item"){
    if(tgt.type === "item") return tgt.id === src.id ? null : "order";
    if(tgt.type === "cat" || tgt.type === "list" || tgt.type === "unlist") return "in";
  }
  if(src.type === "cat" && tgt.type === "cat" && tgt.id !== src.id) return "order";
  if(src.type === "list" && tgt.type === "list" && tgt.id !== src.id) return "order";
  return null;
}
function newKey(sorted, keyFn, srcId, tgtId, after){
  const arr = sorted.filter(x => x.id !== srcId);
  const idx = arr.findIndex(x => x.id === tgtId); if(idx < 0) return null;
  const prev = after ? arr[idx] : arr[idx-1], next = after ? arr[idx+1] : arr[idx];
  if(prev && next) return (keyFn(prev) + keyFn(next)) / 2;
  if(prev) return keyFn(prev) + 1000;
  if(next) return keyFn(next) - 1000;
  return 0;
}
document.addEventListener("dragstart", e => {
  const el = e.target.closest && e.target.closest("[data-drag]"); if(!el || state.phase !== "app") return;
  state.drag = parseRef(el.dataset.drag);
  try{ e.dataTransfer.setData("text/plain", el.dataset.drag); e.dataTransfer.effectAllowed = "move"; }catch(err){}
  el.classList.add("dragging-src");
  if(state.drag.type === "item") document.body.classList.add("is-dragging");
});
document.addEventListener("dragend", () => { state.drag = null; clearMarks(); document.body.classList.remove("is-dragging"); document.querySelectorAll(".dragging-src").forEach(n => n.classList.remove("dragging-src")); });
document.addEventListener("dragover", e => {
  if(!state.drag) return;
  const el = e.target.closest && e.target.closest("[data-drop]");
  clearMarks(); if(!el) return;
  const mode = dropMode(state.drag, parseRef(el.dataset.drop)); if(!mode) return;
  e.preventDefault();
  try{ e.dataTransfer.dropEffect = "move"; }catch(err){}
  if(mode === "in") el.classList.add("drop-in");
  else { const r = el.getBoundingClientRect(); el.classList.add(e.clientX > r.left + r.width/2 ? "drop-after" : "drop-before"); }
});
document.addEventListener("drop", e => {
  if(!state.drag) return;
  const el = e.target.closest && e.target.closest("[data-drop]");
  const src = state.drag; state.drag = null;
  const after = el && el.classList.contains("drop-after");
  clearMarks(); document.body.classList.remove("is-dragging");
  if(!el) return;
  const tgt = parseRef(el.dataset.drop), mode = dropMode(src, tgt); if(!mode) return;
  e.preventDefault();
  if(src.type === "item"){
    const it = state.items.find(i => i.id === src.id); if(!it) return;
    if(tgt.type === "cat"){ if(it.cat !== tgt.id){ W.updItem(it.id, {cat:tgt.id, list:null}).catch(() => {}); toast("Rangé dans « "+(catById(tgt.id)||{}).name+" »."); } }
    else if(tgt.type === "list"){ const l = listById(tgt.id); if(l && it.list !== l.id){ W.updItem(it.id, {cat:l.cat, list:l.id}).catch(() => {}); toast("Ajouté à « "+l.name+" »."); } }
    else if(tgt.type === "unlist"){ if(it.list) W.updItem(it.id, {list:null}).catch(() => {}); }
    else if(tgt.type === "item"){
      const t = state.items.find(i => i.id === tgt.id); if(!t) return;
      const k = newKey(state.grid, itemKey, it.id, t.id, after); if(k === null) return;
      const patch = {order:k};
      if(it.cat !== t.cat) patch.cat = t.cat;
      if((it.list||null) !== (t.list||null)) patch.list = t.list || null;
      W.updItem(it.id, patch).catch(() => {});
    }
  } else if(src.type === "cat"){
    const k = newKey(sortedCats(), ordKey, src.id, tgt.id, after); if(k !== null) W.updCat(src.id, {order:k}).catch(() => {});
  } else if(src.type === "list"){
    const l = listById(src.id); if(!l) return;
    const k = newKey(listsOf(l.cat), ordKey, src.id, tgt.id, after); if(k !== null) W.updList(src.id, {order:k}).catch(() => {});
  }
});

try{ const cached = JSON.parse(LS.get("coin.look") || "null"); if(cached) Object.keys(cached).forEach(k => { if(cached[k] != null) state.settings[k] = cached[k]; }); }catch(e){}
applyAppearance(state.settings);
try{ const l = document.createElement("link"); l.rel = "icon"; l.href = "data:image/svg+xml," + encodeURIComponent(CAT_SVG("").replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" ')); document.head.appendChild(l); }catch(e){}
if(!window.crypto || !crypto.subtle){ state.phase = "error"; state.errorMsg = "Ce navigateur est trop ancien pour ouvrir le coin. Essaie avec Chrome, Firefox ou Safari à jour."; renderGate(); }
else boot();
if(window.__T) window.__app = {deriveKeyCfg, putFile, getFile, encryptBytes, decryptBytes, poll, state};
})();
