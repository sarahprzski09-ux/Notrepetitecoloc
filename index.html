.pres-item{font:inherit;display:grid;gap:3px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:5px;cursor:pointer}
.pres-item:hover,.pres-item:focus-visible{border-color:var(--ink)}
.pres-item img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:var(--line)}
.pres-item span{font-size:.78rem;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.pres-item small{font-size:.7rem;color:var(--muted)}
.pcur{display:flex;gap:10px;align-items:center;margin-top:6px}
.pcur img{width:90px;border-radius:10px;border:2px solid var(--ink)}

/* Personnaliser */
.subhead{font-family:var(--display);font-weight:400;letter-spacing:.04em;font-size:1.2rem;margin:18px 0 8px;padding-top:12px;border-top:1.5px dashed var(--line)}
.font-sample{display:grid;gap:2px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:6px}
.font-sample strong{font-family:var(--display);font-weight:400;font-size:1.4rem;letter-spacing:.03em}
.font-sample em{font-family:var(--hand);font-style:normal;font-size:1.25rem}

/* Couleur libre pour les domaines */
.sw-custom{display:inline-block;overflow:visible;background-image:conic-gradient(from 0deg,#ff9ab8,#ffe08c,#b3c6a5,#bde0ff,#d8c6ff,#ff9ab8) !important;background-size:60% 60% !important;background-repeat:no-repeat !important;background-position:center !important}
.sw-custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0}

/* Réglages */
.subhead.first{border-top:none;margin-top:0;padding-top:0}
input[type=range]{width:100%;accent-color:var(--deep)}
.colorgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.colorfield{display:flex;gap:8px;align-items:center;font-size:.85rem;font-weight:700;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 8px;cursor:pointer}
.colorfield input{width:34px;height:34px;border:2px solid var(--ink);border-radius:10px;padding:0;background:none;cursor:pointer;flex:0 0 auto}
.themes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.themechip{display:inline-flex;align-items:stretch}
.themechip > button:first-child{font:inherit;font-size:.82rem;font-weight:700;display:inline-flex;align-items:center;gap:3px;background:var(--card);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px 4px 6px;cursor:pointer}
.themechip .tc{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.25);display:inline-block}
.themechip .tc:last-of-type{margin-right:5px}
.themechip > button:first-child:has(+ .themechip-x){border-radius:999px 0 0 999px}
.themechip-x{font:inherit;font-weight:800;font-size:.8rem;border:1.5px solid var(--ink);border-left:none;border-radius:0 999px 999px 0;background:var(--card);color:var(--muted);padding:0 9px;cursor:pointer}
.themechip-x:hover{background:#ff8a80;color:var(--ink)}

/* Vu */
.seen{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.seenbox{position:relative;display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px 2px 4px;background:var(--card);color:var(--ink);cursor:pointer}
.seenbox input{position:absolute;opacity:0;width:1px;height:1px}
.seenbox .tick{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);display:inline-grid;place-items:center}
.seenbox.on{background:var(--accent)}
.seenbox.on .tick{background:var(--deep)}
.seenbox.on .tick::after{content:"";width:6px;height:3px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.seenbox.other{cursor:default;opacity:.85}
.seenbox:focus-within{outline:3px solid var(--ink);outline-offset:2px}

/* ===== Deux champs de texte sur les fiches ===== */
.notebox{display:grid;gap:2px}
.nlabel{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.notebox.why .note{font-family:var(--hand)}

/* ===== Réglages : choix du style ===== */
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:6px}
.skinopt{font:inherit;text-align:left;display:grid;gap:2px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:8px 10px;cursor:pointer}
.skinopt[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--accent)}
.skinopt b{font-size:.92rem}
.skinopt small{font-size:.72rem;color:var(--muted);line-height:1.25}
.sk-sw{display:flex;gap:4px;padding:6px;border-radius:9px;border:1px solid rgba(0,0,0,.08)}
.sk-sw i{width:18px;height:18px;border-radius:50%;display:block}

/* Éléments propres à certains styles */
.marquee,.face{display:none}

/* ===== Base commune aux styles modernes ===== */
html:not([data-skin="carnet"]) body{background-image:none !important;background-color:var(--bg)}
html:not([data-skin="carnet"]) .btn{border:none;box-shadow:0 3px 12px rgba(20,15,30,.10);font-family:var(--body);font-weight:800;letter-spacing:0;text-transform:none}
html:not([data-skin="carnet"]) .btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(20,15,30,.14)}
html:not([data-skin="carnet"]) .btn:active{transform:translateY(1px)}
html:not([data-skin="carnet"]) .btn.primary{background:var(--deep);color:#fff}
html:not([data-skin="carnet"]) .btn.ghost{box-shadow:none}
html:not([data-skin="carnet"]) .card{border:none;transform:none;box-shadow:0 8px 28px rgba(20,15,30,.08);border-radius:20px}
html:not([data-skin="carnet"]) .card .tape{display:none}
html:not([data-skin="carnet"]) .card footer{border-top:1px solid var(--line)}
html:not([data-skin="carnet"]) .card img.photo,html:not([data-skin="carnet"]) .card img.poster{border:none;border-radius:14px}
html:not([data-skin="carnet"]) .frame{border:none;box-shadow:0 10px 34px rgba(20,15,30,.10);border-radius:26px}
html:not([data-skin="carnet"]) .frame img.dphoto{border:none}
html:not([data-skin="carnet"]) .tile{border:none;box-shadow:0 8px 26px rgba(20,15,30,.10)}
html:not([data-skin="carnet"]) .tile:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(20,15,30,.14)}
html:not([data-skin="carnet"]) .tile .label{border:none;box-shadow:0 2px 10px rgba(20,15,30,.06)}
html:not([data-skin="carnet"]) .chip{border:none;background:color-mix(in srgb,var(--accent) 45%,var(--card))}
html:not([data-skin="carnet"]) .chip.off{background:var(--line)}
html:not([data-skin="carnet"]) .chip[aria-pressed="true"]{background:var(--deep);color:#fff}
html:not([data-skin="carnet"]) .hero h1,html:not([data-skin="carnet"]) h2.section{letter-spacing:-.01em}
html:not([data-skin="carnet"]) .sheet{border:none;box-shadow:0 20px 60px rgba(20,15,30,.25)}
html:not([data-skin="carnet"]) input[type=text],html:not([data-skin="carnet"]) input[type=url],html:not([data-skin="carnet"]) textarea,html:not([data-skin="carnet"]) select{border:1.5px solid var(--line);background:var(--card)}
html:not([data-skin="carnet"]) .seenbox,html:not([data-skin="carnet"]) .intro-toggle{border-color:var(--line)}
html:not([data-skin="carnet"]) .card.gift{box-shadow:0 8px 28px rgba(20,15,30,.12)}

/* ===== Pastille : app moderne, dégradés, petits visages ===== */
html[data-skin="pastille"] .hero h1{font-weight:800;font-size:clamp(2.2rem,6vw,3.6rem);letter-spacing:-.03em}
html[data-skin="pastille"] .hero h1 .heart{display:none}
html[data-skin="pastille"] .tile{border-radius:30px;background-image:linear-gradient(150deg,rgba(255,255,255,.45),rgba(255,255,255,0) 60%) !important;background-size:auto !important}
html[data-skin="pastille"] .tile .face{display:block;position:absolute;left:50%;top:38%;width:46%;transform:translate(-50%,-50%)}
html[data-skin="pastille"] .tile .face svg{width:100%;height:auto;display:block}
html[data-skin="pastille"] .tile .label{background:transparent;box-shadow:none;padding:0 4px}
html[data-skin="pastille"] .tile .label strong{font-weight:800;letter-spacing:-.01em}
html[data-skin="pastille"] .tile .label em,html[data-skin="pastille"] .tile .label span{color:color-mix(in srgb,var(--ink) 75%,transparent)}
html[data-skin="pastille"] .tile.fav .bigheart{top:10%;width:38%}
html[data-skin="pastille"] .card{border-radius:24px}
html[data-skin="pastille"] .tile.new{background:transparent !important;border:2px dashed var(--line)}

/* ===== Papeterie : crème, grands titres bicolores, cercles ===== */
html[data-skin="papeterie"] .hero h1{font-weight:800;color:var(--deep);font-size:clamp(2.6rem,7vw,4.6rem);letter-spacing:-.02em;line-height:.95}
html[data-skin="papeterie"] .hero h1 .heart{display:none}
html[data-skin="papeterie"] .hero p.sub{font-family:var(--body);font-size:1.25rem;color:var(--ink)}
html[data-skin="papeterie"] .home-grid .tiles{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));row-gap:64px;padding-bottom:40px}
html[data-skin="papeterie"] .tile{border-radius:50%;overflow:visible;box-shadow:none}
html[data-skin="papeterie"] .tile:hover{box-shadow:0 10px 26px rgba(20,15,30,.12)}
html[data-skin="papeterie"] .tile img.tcover{border-radius:50%}
html[data-skin="papeterie"] .tile .label{position:absolute;left:0;right:0;top:calc(100% + 8px);background:none;box-shadow:none;text-align:center;padding:0;justify-items:center}
html[data-skin="papeterie"] .tile .label strong{font-family:var(--body);font-weight:800;font-size:1rem;letter-spacing:0}
html[data-skin="papeterie"] .tile .label em{font-family:var(--body);font-size:.82rem;color:var(--muted)}
html[data-skin="papeterie"] .tile.new{border:2px dashed var(--line);font-family:var(--body);font-size:.95rem}
html[data-skin="papeterie"] h2.section{color:var(--deep);font-weight:800}
html[data-skin="papeterie"] .home-hero::after{content:"";display:block;height:28px;margin:18px -18px 0;background:var(--accent);
  -webkit-mask:radial-gradient(28px 14px at 50% 0,#000 98%,transparent) 0 0/56px 28px repeat-x;mask:radial-gradient(28px 14px at 50% 0,#000 98%,transparent) 0 0/56px 28px repeat-x;transform:rotate(180deg)}

/* ===== Argile : arches, festons, sauge et bordeaux ===== */
html[data-skin="argile"] .hero h1{color:var(--deep);font-weight:400;font-size:clamp(2.4rem,6.5vw,4rem)}
html[data-skin="argile"] .hero h1 .heart{display:none}
html[data-skin="argile"] .hero p.sub{font-family:var(--body);color:var(--ink)}
html[data-skin="argile"] .home-hero{background:var(--deep);color:#fff;border-radius:28px 28px 0 0;padding:34px 30px 30px;margin-bottom:34px;position:relative}
html[data-skin="argile"] .home-hero h1,html[data-skin="argile"] .home-hero p.sub,html[data-skin="argile"] .home-hero .icon-btn{color:#fff}
html[data-skin="argile"] .home-hero::after{content:"";position:absolute;left:0;right:0;bottom:-18px;height:18px;background:var(--deep);
  -webkit-mask:radial-gradient(18px 18px at 50% 0,#000 98%,transparent) 0 0/36px 18px repeat-x;mask:radial-gradient(18px 18px at 50% 0,#000 98%,transparent) 0 0/36px 18px repeat-x}
html[data-skin="argile"] .home-hero .btn{background:var(--card);color:var(--deep)}
html[data-skin="argile"] .home-hero .btn.primary{background:var(--accent);color:var(--ink)}
html[data-skin="argile"] .home-hero .intro-toggle{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
html[data-skin="argile"] .tile{aspect-ratio:3/4;border-radius:999px 999px 22px 22px}
html[data-skin="argile"] .tile .label{background:var(--card);text-align:center;justify-items:center}
html[data-skin="argile"] .tile .label strong{font-weight:400}
html[data-skin="argile"] .tile.new{border:2px dashed var(--line)}
html[data-skin="argile"] h2.section{color:var(--deep);font-weight:400}
html[data-skin="argile"] .frame{border-radius:999px 999px 26px 26px;padding-top:70px}
html[data-skin="argile"] .daily .perch{top:-58px}
html[data-skin="argile"] .doodles{display:none}

/* ===== Festival : bandeau festonné et ruban qui défile ===== */
html[data-skin="festival"] .hero h1{text-transform:uppercase;font-weight:400;letter-spacing:.01em;font-size:clamp(2.4rem,7vw,4.2rem)}
html[data-skin="festival"] .hero h1 .heart{display:none}
html[data-skin="festival"] .wrap{padding-top:0}
html[data-skin="festival"] #head{position:relative}
html[data-skin="festival"] #head::before{content:"";display:block;height:46px;margin:0 calc(50% - 50vw) 18px;background:var(--accent);
  -webkit-mask:linear-gradient(#000,#000) 0 0/100% 32px no-repeat,radial-gradient(14px 14px at 50% 0,#000 98%,transparent) 0 32px/28px 14px repeat-x;mask:linear-gradient(#000,#000) 0 0/100% 32px no-repeat,radial-gradient(14px 14px at 50% 0,#000 98%,transparent) 0 32px/28px 14px repeat-x}
html[data-skin="festival"] .marquee{display:block;overflow:hidden;margin:22px calc(50% - 50vw) 8px;background:var(--deep);color:#fff;padding:9px 0;transform:rotate(-1deg)}
html[data-skin="festival"] .marquee > div{display:flex;gap:22px;width:max-content;animation:defile 38s linear infinite;font-family:var(--display);text-transform:uppercase;font-size:1.05rem;letter-spacing:.04em}
html[data-skin="festival"] .marquee i{font-style:normal;color:var(--butter)}
@keyframes defile{to{transform:translateX(-50%)}}
html[data-skin="festival"] .home-grid .tiles{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));row-gap:60px;padding-bottom:36px}
html[data-skin="festival"] .tile{border-radius:50%;overflow:visible;box-shadow:none}
html[data-skin="festival"] .tile img.tcover{border-radius:50%}
html[data-skin="festival"] .tile .label{position:absolute;left:0;right:0;top:calc(100% + 8px);background:none;box-shadow:none;text-align:center;padding:0;justify-items:center}
html[data-skin="festival"] .tile .label strong{font-size:1rem;text-transform:uppercase}
html[data-skin="festival"] .tile .label em,html[data-skin="festival"] .tile .label span{font-family:var(--body);font-size:.78rem;color:var(--muted)}
html[data-skin="festival"] .tile.new{border:2px dashed var(--line)}
html[data-skin="festival"] h2.section{text-transform:uppercase;font-weight:400}
html[data-skin="festival"] .frame{background:var(--card)}
@media (prefers-reduced-motion:reduce){html[data-skin="festival"] .marquee > div{animation:none}}
html:not([data-skin="carnet"]) .home-hero p.sub{font-family:var(--body);letter-spacing:0}
html[data-skin="papeterie"] .home-grid .tiles,html[data-skin="festival"] .home-grid .tiles{row-gap:96px;padding-bottom:84px}
html[data-skin="festival"] .marquee{margin-bottom:46px}

/* ===== Style « Coloc » : titre géant, polaroïds, calendrier ===== */
html[data-skin="coloc"] body{background-color:var(--bg) !important;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px) !important;background-size:26px 26px !important}
html[data-skin="coloc"] .btn{border-radius:999px;font-family:var(--body);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;padding:10px 20px}
html[data-skin="coloc"] .btn.small{padding:7px 16px;font-size:.72rem}
html[data-skin="coloc"] .btn.ghost{text-transform:none;letter-spacing:0;font-size:.9rem}
html[data-skin="coloc"] .hero h1,html[data-skin="coloc"] h2.section,html[data-skin="coloc"] .sheet h2,html[data-skin="coloc"] .empty h3{text-transform:uppercase;letter-spacing:.01em;font-weight:400;color:var(--deep)}
html[data-skin="coloc"] .card{background:var(--card)}
html[data-skin="coloc"] .topbar{margin-bottom:2px}

/* barre de navigation */
.cnav{display:none}
html[data-skin="coloc"] .cnav{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:6px 0 10px;flex-wrap:wrap}
.clogo{font-family:var(--display);color:var(--deep);font-size:1.45rem;line-height:.95;text-transform:uppercase}
.clinks{display:flex;gap:24px;flex-wrap:wrap;font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.clinks a{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.clinks a:hover{color:var(--deep);text-decoration:underline;text-underline-offset:4px}
.clinks b{background:var(--accent);color:#fff;border-radius:999px;padding:0 8px;font-size:.7rem;letter-spacing:0}

/* en-tête */
.chero{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start;padding:8px 0 26px}
.ctext{position:relative;z-index:2;display:grid;gap:10px;align-content:start}
.ctitle{margin:6px 0 0;font-family:var(--display);color:var(--deep);font-weight:400;text-transform:uppercase;font-size:clamp(4rem,10.5vw,8.4rem);line-height:.88;letter-spacing:.005em;display:grid}
.cscript{font-family:"Yellowtail",var(--hand);color:var(--accent);font-size:clamp(3.4rem,8.5vw,6.6rem);line-height:1;position:absolute;left:min(56%,330px);top:clamp(9rem,21vw,17rem);transform:rotate(-7deg);white-space:nowrap;pointer-events:none}
.chero .intro{margin-top:14px}
.chero .intro .sub{font-family:var(--body);font-size:.98rem;line-height:1.6;max-width:36ch;color:var(--ink)}
.chero .doodles{z-index:1}
.chero .doodle-etoiles{top:4px !important;right:46% !important}
.chero .doodle-dragon{top:auto !important;bottom:6px !important;right:48% !important}

/* polaroïds */
.cstack{position:relative;min-height:480px;margin-top:40px}
.pol{position:absolute;margin:0;background:#fff;padding:12px 12px 46px;box-shadow:0 14px 34px rgba(30,40,25,.16);cursor:pointer;transition:transform .25s}
.pol:hover{transform:rotate(0deg) scale(1.02) !important;z-index:4}
.pol img{display:block;width:100%;height:100%;object-fit:cover;background:var(--line)}
.pol figcaption{position:absolute;left:14px;right:14px;bottom:10px;font-family:var(--hand);font-size:1.45rem;line-height:1.1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptape{position:absolute;top:-14px;left:50%;width:96px;height:26px;transform:translateX(-50%) rotate(-4deg);background:color-mix(in srgb,var(--accent) 60%,transparent);z-index:2}
.pol.big{right:4%;top:34px;width:min(330px,62%);aspect-ratio:290/380;transform:rotate(4deg)}
.pol.small{left:2%;top:190px;width:min(180px,36%);aspect-ratio:150/240;transform:rotate(-7deg);z-index:3}
.pol.empty{border:none;font:inherit;text-align:center;color:var(--muted)}
.ph-empty{display:grid;place-items:center;align-content:center;gap:10px;height:100%;border:2px dashed var(--line);font-size:.85rem;padding:14px}
.ph-empty .ico{width:42px;height:42px;color:var(--deep)}
.cstack .perch{top:-30px;left:auto;right:calc(4% + 80px);transform:none;width:126px;z-index:5}
.sticker{position:absolute;display:grid;place-items:center;text-align:center;font-family:var(--hand);line-height:1;color:#fff;background:var(--accent);
  clip-path:polygon(50% 0%,61% 8%,75% 6%,82% 18%,94% 25%,92% 39%,100% 50%,92% 61%,94% 75%,82% 82%,75% 94%,61% 92%,50% 100%,39% 92%,25% 94%,18% 82%,6% 75%,8% 61%,0% 50%,8% 39%,6% 25%,18% 18%,25% 6%,39% 8%)}
.sticker.s1{right:-6px;top:6px;width:124px;height:124px;font-size:1.55rem;transform:rotate(12deg);z-index:6}
.stk-link{text-decoration:none}
.cstack .capy{left:auto;right:58%;bottom:-6px;top:auto;z-index:1}

/* compteurs */
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:6px 0 26px}
.num{border-radius:22px;padding:16px 20px;background:var(--t1);color:var(--ink);text-decoration:none;display:grid;gap:2px}
.num:nth-child(2){background:var(--t2)}.num:nth-child(3){background:var(--t3)}.num:nth-child(4){background:var(--t4)}
.num b{font-family:var(--display);font-weight:400;font-size:3rem;line-height:1;color:var(--deep)}
.num span{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
a.num:hover{outline:2px solid var(--deep)}

/* ticket « cette semaine » */
.ticket{background:var(--deep);border-radius:28px;padding:34px 40px 40px;margin-bottom:34px}
.tin{background:var(--card);padding:34px 30px 26px;border-radius:0 0 16px 16px;-webkit-mask:radial-gradient(16px 16px at 50% 0,transparent 98%,#000) 0 0/40px 100% repeat-x;mask:radial-gradient(16px 16px at 50% 0,transparent 98%,#000) 0 0/40px 100% repeat-x}
.tin h3{text-align:center;margin:0;font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.tin h2{text-align:center;font-family:var(--display);font-weight:400;color:var(--deep);font-size:2.5rem;text-transform:uppercase;margin:2px 0 20px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{font:inherit;color:var(--ink);text-align:left;cursor:pointer;border:2px solid var(--ink);border-radius:16px;background:var(--card);padding:10px 10px 12px;min-height:128px;display:grid;align-content:start;gap:8px;position:relative;min-width:0;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.day:hover{transform:translateY(-3px);box-shadow:0 3px 0 var(--ink)}
.day .d{display:flex;justify-content:space-between;align-items:baseline;font-size:.68rem;font-weight:800;letter-spacing:.06em}
.day .d span:last-child{font-family:var(--display);font-size:1.35rem;letter-spacing:0;line-height:1;color:var(--deep)}
.day .ics{display:flex;flex-wrap:wrap;gap:5px}
.day .ics i{width:28px;height:28px;border-radius:9px;padding:6px;color:#fff;display:block}
.day .ics b{font-size:.72rem;align-self:center}
.day u{font-size:.74rem;font-weight:600;text-decoration:none;color:var(--muted)}
.day.off{background:transparent;border-style:dashed;border-color:var(--line)}
.day.off .d span:last-child{color:var(--muted)}
.day.off:hover{box-shadow:none;background:var(--t1)}
.day.today{background:var(--t2);border-color:var(--ink)}
.day.today::after{content:"";position:absolute;top:-9px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--ink);pointer-events:none}
@media (max-width:900px){

  .day{min-height:0;padding:8px 4px 10px;border-radius:14px;justify-items:center;text-align:center;gap:6px}
  .day .d{flex-direction:column;align-items:center;gap:2px;font-size:.58rem}
  .day .d span:last-child{font-size:1.15rem}
  .day .ics{justify-content:center;gap:3px}
  .day .ics i{width:9px;height:9px;padding:0;border-radius:50%;font-size:0}
  .day .ics i svg{display:none}

  .day u{font-size:.6rem;line-height:1.15}

}

/* domaines */
.chead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 16px}
.chead h2{font-family:var(--display);font-weight:400;color:var(--deep);font-size:2.2rem;text-transform:uppercase;margin:0}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.ccard{position:relative;overflow:hidden;background:var(--card);border-radius:24px;padding:18px;min-height:230px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:2px;box-shadow:0 6px 22px rgba(30,40,25,.07);transition:transform .2s,box-shadow .2s}
.ccard:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(30,40,25,.12)}
.ccard small{font-size:.62rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.6;position:relative}
.ccard strong{font-family:var(--display);font-weight:400;color:var(--dd);font-size:1.9rem;line-height:1.05;text-transform:uppercase;position:relative;overflow-wrap:anywhere}
.ccard em{font-style:normal;font-size:.8rem;font-weight:600;position:relative}
.ccard .big{position:absolute;right:-22px;bottom:-22px;width:160px;height:160px;color:var(--dc);opacity:.95}
.ccard .ccover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.22}
.ccard .go{position:absolute;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;background:var(--dd);padding:12px;color:#fff}
.sticker.s2{left:14px;bottom:14px;width:80px;height:80px;font-size:1.1rem;transform:rotate(-10deg)}

/* liste à regarder */
.watchbox{display:grid;grid-template-columns:1fr 1.2fr;border-radius:28px;overflow:hidden;margin:40px 0 30px}
.wl{background:var(--t3);padding:38px;display:grid;gap:10px;align-content:center;justify-items:start}
.wl small{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.wl h2{font-family:var(--display);font-weight:400;color:var(--deep);font-size:2.8rem;line-height:1;margin:0;text-transform:uppercase}
.wl p{margin:0;max-width:34ch;line-height:1.55}
.wr{position:relative;min-height:320px;background:repeating-linear-gradient(90deg,var(--t2) 0 18px,var(--card) 18px 36px)}
.wr .pol{width:170px;aspect-ratio:170/250;top:40px}
.wr .pol.w0{left:16%;transform:rotate(-4deg)}
.wr .pol.w1{left:50%;transform:rotate(5deg)}
.wr-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--deep);opacity:.4}
.wr-empty .ico{width:90px;height:90px}

/* fenêtre « fiche » */
.modal-wall .wall{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.iconpick{display:flex;flex-wrap:wrap;gap:6px}
.iconpick button{width:42px;height:42px;padding:9px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}

/* ===== Écrans d'ouverture ===== */
.gatewrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,420px);gap:40px;align-items:center;min-height:calc(100vh - 80px);padding:20px 0}
.gtitle{position:relative}

html[data-skin="coloc"] .gate > *{transform:rotate(-2deg)}

.gh{font-family:var(--display);font-weight:400;color:var(--deep);text-transform:uppercase;font-size:2.2rem;line-height:1;margin:0 0 6px}

html[data-skin="coloc"] .gate input[type=text],html[data-skin="coloc"] .gate input[type=password]{border:2px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--card)}
html[data-skin="coloc"] .gate input:focus{border-color:var(--deep);outline:none}
html[data-skin="coloc"] .gate .btn.primary{width:100%;justify-content:center;margin-top:4px}

.loader{display:flex;gap:14px;justify-content:center;padding:18px 0 6px;color:var(--deep)}

@keyframes pas{0%,100%{transform:translateY(0) rotate(-10deg);opacity:.35}40%{transform:translateY(-10px) rotate(8deg);opacity:1}}

}

/* bulle de la photo du jour */

/* Petit mot d'accueil pleine largeur */
.letter{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:22px 28px 18px;margin:0 0 26px;box-shadow:6px 6px 0 var(--accent);background-image:repeating-linear-gradient(transparent 0 31px,var(--grid) 31px 32px);background-position:0 14px}
.letter .lhead{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.letter .lstamp{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:1.1rem;border:2px solid var(--ink);transform:rotate(-8deg);flex:none}

.pastille::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:pastPulse 1.4s ease-in-out infinite}

.rtb-file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.rtb-sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.redit{min-height:180px;max-height:55vh;overflow:auto;border:2px solid var(--ink);border-radius:0 0 14px 14px;background:var(--card);padding:12px 14px;outline:none}
.redit:focus{box-shadow:0 0 0 3px var(--t2)}
.redit:empty::before{content:attr(data-ph);color:var(--muted)}
/* Texte mis en forme (formulaire + fiches) */
.rich{font-size:1rem;line-height:1.55;overflow-wrap:anywhere}
.rich>*:first-child{margin-top:0}.rich>*:last-child{margin-bottom:0}
.rich p{margin:0 0 .6em}
.rich h3{font-family:var(--display);font-weight:400;color:var(--deep);font-size:1.35rem;margin:.6em 0 .3em;line-height:1.1}
.rich h4{font-size:1rem;font-weight:800;margin:.6em 0 .25em;color:var(--deep)}
.rich ul,.rich ol{margin:0 0 .6em;padding-left:1.3em}
.rich blockquote{margin:.4em 0 .7em;padding:6px 12px;border-left:4px solid var(--accent);background:var(--t1);border-radius:0 10px 10px 0;font-style:italic}
.rich mark{background:#fff1a8;padding:0 2px;border-radius:3px;color:inherit}
.rich a{color:var(--deep);text-underline-offset:3px}
.rich img{display:block;max-width:100%;height:auto;border-radius:12px;margin:.5em auto;border:2px solid var(--ink)}
.card .rich{max-height:320px;overflow:hidden}
.card.rich-long:not(.rich-open) .rich{-webkit-mask:linear-gradient(#000 70%,transparent);mask:linear-gradient(#000 70%,transparent)}
.card.rich-open .rich{max-height:none}
.rich-more{display:none;justify-self:start;font:inherit;font-size:.8rem;font-weight:800;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.card.rich-long .rich-more{display:inline-block}
.pwmeter{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.pwmeter i{display:block;height:100%;width:0;background:#d9534f;transition:width .25s,background .25s}
.pwmeter[data-level="0"] i{width:15%;background:#d9534f}
.pwmeter[data-level="1"] i{width:45%;background:#e8a33b}
.pwmeter[data-level="2"] i{width:72%;background:#9bbf5a}
.pwmeter[data-level="3"] i{width:100%;background:var(--deep)}
.myfonts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.myfont{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:999px;padding:4px 6px 4px 14px;background:var(--card)}
.myfont b{font-weight:400;font-size:1.15rem}
.myfont small{font-size:.65rem;color:var(--muted)}
.fontup{position:relative;overflow:hidden;cursor:pointer;justify-self:start}
.fontup input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* Favoris rangés par domaine */
.favtools{display:flex;justify-content:flex-end;margin:0 0 10px}
.favgroups{display:grid;gap:14px}
.favgroup{border:2px solid var(--ink);border-radius:20px;background:var(--card);overflow:hidden}
.favgroup>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;background:var(--c);transition:filter .15s}
.favgroup>summary::-webkit-details-marker{display:none}
.favgroup>summary:hover{filter:brightness(1.04)}
.fg-ic{width:40px;height:40px;border-radius:12px;background:var(--cd);color:#fff;display:grid;place-items:center;padding:9px;flex:none;border:2px solid var(--ink)}
.fg-ic svg{width:100%;height:100%}
.fg-name{font-family:var(--display);font-size:1.4rem;color:var(--ink);line-height:1.05}
.fg-n{min-width:26px;height:26px;padding:0 7px;border-radius:99px;background:var(--card);border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.fg-thumbs{display:flex;margin-left:auto;padding-left:8px}
.fg-thumbs img{width:34px;height:46px;object-fit:cover;border-radius:6px;border:2px solid var(--card);margin-left:-12px;box-shadow:0 2px 6px rgba(0,0,0,.15);transform:rotate(-3deg)}
.fg-thumbs img:nth-child(even){transform:rotate(4deg)}
.favgroup[open] .fg-thumbs{display:none}
.fg-chev{width:16px;height:11px;flex:none;color:var(--ink);transition:transform .2s;margin-left:6px}
.favgroup:not([open]) .fg-chev{margin-left:auto}
.fg-thumbs~.fg-chev{margin-left:6px}
.favgroup[open] .fg-chev{transform:rotate(180deg);margin-left:auto}
.fg-body{padding:16px;border-top:2px solid var(--ink)}
@media (max-width:640px){.favgroup>summary{padding:10px 12px;gap:9px}.fg-ic{width:34px;height:34px;padding:7px}.fg-name{font-size:1.1rem}.fg-thumbs img{width:26px;height:36px;margin-left:-10px}.fg-body{padding:10px}}
.indaily{margin-top:-4px}
.indaily .help{display:inline;margin-left:2px}
.field:has(.ph-prev:empty)+.indaily{display:none}
/* Shorts et TikTok : miniature verticale */
.card img.poster.vertical{aspect-ratio:9/16;width:min(100%,220px);height:auto;max-height:none;object-fit:cover;object-position:center;justify-self:center;border-radius:14px}
html[data-skin="coloc"] .card img.poster.vertical{max-height:none}
.card img.poster.broken{display:none}
/* Lecteur TikTok intégré */
.sheet.ttsheet{max-width:420px}
.ttplayer{aspect-ratio:9/16;max-height:72vh;width:100%;margin:0 auto;border-radius:18px;overflow:hidden;border:2px solid var(--ink);background:#000}
.ttplayer iframe{width:100%;height:100%;border:0;display:block}
.ttnote{text-align:center;margin-top:8px}
.card img.poster[data-act="tt-play"]{cursor:pointer}
/* Notifications */
.nbell{position:relative}
.nbell svg{display:block}
.nbell b{position:absolute;top:-8px;right:-12px}
.notifs{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:14px 16px;margin:0 0 22px;box-shadow:6px 6px 0 var(--deep)}
.nhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.nhead h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.35rem;color:var(--deep);display:flex;align-items:center;gap:8px}
.nbadge{background:var(--accent);color:#fff;border:2px solid var(--ink);border-radius:999px;font-family:var(--body);font-size:.75rem;font-weight:800;padding:1px 9px}
.nlist{display:grid;gap:6px}
.notif{font:inherit;color:var(--ink);text-align:left;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;cursor:pointer;transition:border-color .15s,transform .15s}
.notif:hover{border-color:var(--ink);transform:translateX(2px)}
.nic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--deep);border:2px solid var(--ink);font-size:.85rem}
.notif.reply .nic{background:var(--accent)}
.ntx{font-size:.92rem;line-height:1.35;min-width:0}
.ntx i{display:block;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.nwhen{font-size:.72rem;color:var(--muted);white-space:nowrap}
.notif.old{opacity:.6}
.notif.new{border-color:var(--accent)}
.nmore{margin-top:8px;font:inherit;font-size:.82rem;font-weight:800;background:none;border:none;color:var(--deep);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
@media (max-width:640px){.notif{grid-template-columns:auto 1fr;padding:8px 10px}.nwhen{grid-column:2}.nhead h2{font-size:1.15rem}}
/* Cartes domaines : le texte reste lisible au-dessus de l'icône */
.ccard small,.ccard strong,.ccard em{z-index:2;text-shadow:0 0 3px var(--card),0 0 8px var(--card),0 0 14px var(--card)}
.ccard strong,.ccard em{max-width:calc(100% - 40px)}
.ccard .big{width:124px;height:124px;right:-18px;bottom:-18px;z-index:1}
.ccard .go{z-index:3}
.ccard.long strong{font-size:1.45rem}
@media (max-width:760px){.ccard .big{width:90px;height:90px}.ccard.long strong{font-size:1.08rem}.ccard strong,.ccard em{max-width:100%}}
.tophome{margin-right:auto;display:inline-flex;align-items:center;gap:7px;padding:7px 14px 7px 12px;border-radius:999px;background:var(--deep);color:#fff;text-decoration:none;font-weight:800;font-size:.82rem;letter-spacing:.04em;border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);transition:transform .15s}
.tophome:hover{transform:translateY(-1px);filter:brightness(1.08)}
.tophome:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.topbar{align-items:center}
@media (max-width:640px){html[data-skin="coloc"] .topbar .tophome{padding:6px 12px 6px 10px;font-size:.78rem}}
/* Bandes-annonces */
.sheet .trailer-field{display:none}
.sheet.is-film:not(.mode-text) .trailer-field{display:grid}
.trailer-btn{background:var(--ink);color:#fff;border-color:var(--ink)}
.trailer-btn:hover{filter:brightness(1.2)}
.sheet.ytsheet{max-width:860px}
.ytplayer{aspect-ratio:16/9;width:100%;border-radius:16px;overflow:hidden;border:2px solid var(--ink);background:#000}
.ytplayer iframe{width:100%;height:100%;border:0;display:block}

</style>

</head>

  <div id="head"></div>

  <div id="status"></div>
  <main id="main"></main>
</div>

<div id="toastRoot"></div>

}

function hexA(hex, a){ const n = parseInt(hex.slice(1),16); return "rgba("+(n>>16&255)+","+(n>>8&255)+","+(n&255)+","+a+")"; }
function hexToRgb(h){ h = String(h||"").replace("#",""); if(h.length === 3) h = h.split("").map(x => x+x).join(""); const n = parseInt(h, 16); return isNaN(n) ? [179,198,165] : [n>>16&255, n>>8&255, n&255]; }
function rgbToHex(r){ return "#" + r.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join(""); }
function mixHex(a, b, t){ const x = hexToRgb(a), y = hexToRgb(b); return rgbToHex(x.map((v, i) => v + (y[i] - v) * t)); }
function themeFromColor(hex){ return {name:"Perso", accent: hex, bg: mixHex(hex, "#ffffff", .86), deep: mixHex(hex, "#1e2a1a", .55)}; }
const isHex = v => /^#[0-9a-f]{6}$/i.test(v || "");
function themeOf(c){
  if(c && c.theme === "custom" && isHex(c.custom)) return themeFromColor(c.custom);
  return THEMES[c && c.theme] || THEMES[THEME_KEYS[(c && c.color || 0) % THEME_KEYS.length]];
}
function patternOf(c){ return (c && PATTERNS[c.pattern]) ? c.pattern : "pois"; }
function patternCSS(p, th, strong){
  const pc = strong ? hexA(th.deep, .22) : hexA(th.deep, .13);
  const svg = (d, s) => "url('data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+s+'" height="'+s+'" viewBox="0 0 24 24"><path d="'+d+'" fill="'+pc+'" transform="translate(6 6) scale(.5)"/></svg>') + "')";
  switch(p){
    case "rayures": return "background-image:repeating-linear-gradient(45deg,"+pc+" 0 6px,transparent 6px 18px);background-size:auto";
    case "carreaux": return "background-image:linear-gradient("+pc+" 2px,transparent 2px),linear-gradient(90deg,"+pc+" 2px,transparent 2px);background-size:26px 26px";
    case "coeurs": return "background-image:"+svg(HEART_PATH, 34)+";background-size:34px 34px";
    case "etoiles": return "background-image:"+svg("M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z", 34)+";background-size:34px 34px";
    case "uni": return "background-image:none";
    default: return "background-image:radial-gradient("+pc+" 2px,transparent 2.4px);background-size:20px 20px";
  }
}
function themeVars(th){ return "--accent:"+th.accent+";--deep:"+th.deep+";--bg:"+th.bg+";--c:"+th.accent; }

/* ---------- Chiffrement (AES-GCM, clé dérivée du mot de passe) ---------- */
const TE = new TextEncoder(), TD = new TextDecoder();
function b64(bytes){ let s = ""; const ch = 0x8000; for(let i = 0; i < bytes.length; i += ch) s += String.fromCharCode.apply(null, bytes.subarray(i, i+ch)); return btoa(s); }
function unb64(str){ const s = atob(String(str).replace(/\s/g,"")); const u = new Uint8Array(s.length); for(let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
async function deriveKey(password, saltB64, iter){
  const base = await crypto.subtle.importKey("raw", TE.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt: unb64(saltB64), iterations: iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);
}
const ARGON = {m: 65536, t: 3, p: 1};
async function deriveKeyCfg(password, cfg){
  if(cfg && cfg.kdf === "argon2id"){
    if(!window.hashwasm) throw new Error("Argon2 indisponible");
    const raw = await hashwasm.argon2id({password, salt: unb64(cfg.salt), parallelism: cfg.p || 1, iterations: cfg.t || 3, memorySize: cfg.m || 65536, hashLength: 32, outputType: "binary"});
    return crypto.subtle.importKey("raw", raw, {name:"AES-GCM"}, true, ["encrypt","decrypt"]);
  }
  return deriveKey(password, cfg.salt, cfg.iter);
}
const newKdfConfig = salt => ({kdf: "argon2id", salt, m: ARGON.m, t: ARGON.t, p: ARGON.p});
async function decryptAny(bytes){
  try{ return await decryptBytes(state.key, bytes); }
  catch(e){ if(state.altKey) return decryptBytes(state.altKey, bytes); throw e; }
}
async function encryptBytes(key, bytes){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, bytes));
  const out = new Uint8Array(12 + ct.length); out.set(iv, 0); out.set(ct, 12); return out;
}
async function decryptBytes(key, bytes){
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv: bytes.subarray(0,12)}, key, bytes.subarray(12)));
}
const encryptJSON = (key, obj) => encryptBytes(key, TE.encode(JSON.stringify(obj)));
const decryptJSON = async (key, bytes) => JSON.parse(TD.decode(await decryptBytes(key, bytes)));

/* ---------- GitHub ---------- */
function detectRepo(){
  if(REPO_OVERRIDE.owner && REPO_OVERRIDE.repo) return {...REPO_OVERRIDE};
  const h = location.hostname, m = h.match(/^([^.]+)\.github\.io$/i);
  if(m){
    const seg = location.pathname.split("/").filter(Boolean)[0];
    return {owner: m[1], repo: seg && !/\.html?$/.test(seg) ? seg : h};
  }
  const saved = LS.get("coin.repo");
  if(saved){ try{ return JSON.parse(saved); }catch(e){} }
  return null;
}
class GhError extends Error { constructor(status, msg){ super(msg || ("GitHub " + status)); this.status = status; } }
async function gh(repo, token, path, opts = {}){
  const headers = {"Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", ...(opts.headers||{})};
  if(token) headers.Authorization = "Bearer " + token;
  let res;
  try{ res = await fetch("https://api.github.com/repos/"+repo.owner+"/"+repo.repo+path, {...opts, headers, cache:"no-store"}); }
  catch(e){ throw new GhError(0, "Réseau indisponible"); }
  return res;
}
async function getFile(repo, token, path, etag){
  const headers = etag ? {"If-None-Match": etag} : {};
  const res = await gh(repo, token, "/contents/"+path+"?ref="+DATA_BRANCH, {headers});
  if(res.status === 304) return {status:304};
  if(res.status === 404) return {status:404};
  if(!res.ok) throw new GhError(res.status);
  const j = await res.json();
  let bytes;
  if(j.content && j.encoding === "base64") bytes = unb64(j.content);
  else {
    const raw = await gh(repo, token, "/contents/"+path+"?ref="+DATA_BRANCH, {headers:{"Accept":"application/vnd.github.raw"}});
    if(!raw.ok) throw new GhError(raw.status);
    bytes = new Uint8Array(await raw.arrayBuffer());
  }
  return {status:200, sha:j.sha, bytes, etag: res.headers.get("ETag")};
}
async function putFile(repo, token, path, bytes, sha, message){
  const body = {message: message || "petit coin", content: b64(bytes), branch: DATA_BRANCH};
  if(sha) body.sha = sha;
  const res = await gh(repo, token, "/contents/"+path, {method:"PUT", body: JSON.stringify(body), headers:{"Content-Type":"application/json"}});
  if(!res.ok) throw new GhError(res.status);
  const j = await res.json();
  return j.content.sha;
}
async function ensureBranch(repo, token){
  const r = await gh(repo, token, "/git/ref/heads/"+DATA_BRANCH);
  if(r.ok) return;
  const info = await gh(repo, token, "");
  if(!info.ok) throw new GhError(info.status);
  const def = (await info.json()).default_branch;
  const head = await gh(repo, token, "/git/ref/heads/"+def);
  if(!head.ok) throw new GhError(head.status, "Le dépôt est vide : ajoute d'abord index.html.");
  const sha = (await head.json()).object.sha;
  const mk = await gh(repo, token, "/git/refs", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ref:"refs/heads/"+DATA_BRANCH, sha})});
  if(!mk.ok && mk.status !== 422) throw new GhError(mk.status);
}

/* ---------- Petites notifications : ce que l'autre a regardé ou répondu ---------- */
function notifications(){
  const me = state.me, ev = [];
  const norm = x => String(x || "").trim().toLowerCase();
  const others = new Set(people().filter(p => norm(p) !== norm(me)).map(norm));
  const isOther = who => others.has(norm(who));
  state.items.forEach(it => {
    const label = it.title || (it.rich ? richText(it.rich).slice(0, 40) : "") || (it.note || "").slice(0, 40) || "un partage";
    Object.entries(it.seenAt || {}).forEach(([who, at]) => { if(isOther(who) && norm(it.author) !== norm(who) && (it.seenBy || []).includes(who)) ev.push({type:"seen", who, at, label, id: it.id, word: seenWord(catById(it.cat)).toLowerCase()}); });
    (it.replies || []).forEach(r => { if(isOther(r.by) && r.at) ev.push({type:"reply", who: r.by, at: r.at, label, id: it.id, text: r.text}); });
  });
  state.lists.forEach(l => (l.replies || []).forEach(r => { if(isOther(r.by) && r.at) ev.push({type:"reply", who: r.by, at: r.at, label: l.name || "une liste", list: l.id, cat: l.cat, text: r.text}); }));
  return ev.sort((a,b) => b.at - a.at);
}

    + (n.text ? '<i>“'+esc(n.text.length > 90 ? n.text.slice(0, 88) + "…" : n.text)+'”</i>' : '')+'</span><span class="nwhen">'+esc(timeAgo(n.at))+'</span></button>';

function timeAgo(ts){
  const m = Math.round((Date.now() - ts) / 60000);
  if(m < 1) return "à l'instant"; if(m < 60) return "il y a " + m + " min";
  const h = Math.round(m / 60); if(h < 24) return "il y a " + h + " h";
  const d = Math.round(h / 24); if(d < 7) return d === 1 ? "hier" : "il y a " + d + " jours";
  return fmtDate(ts);
}

/* ---------- Synchronisation ---------- */
async function loadServer(useEtag){
  const f = await getFile(state.repo, state.token, DATA_PATH, useEtag ? state.etag : null);
  if(f.status === 304) return false;
  if(f.status === 404) throw new GhError(404, "Données introuvables");
  state.data = await decryptJSON(state.key, f.bytes);
  state.sha = f.sha; state.etag = f.etag;
  return true;
}
function commit(mut, msg){
  return new Promise((resolve, reject) => {
    state.pending.push({mut, msg, resolve, reject});
    try{ mut(state.data); }catch(e){}
    syncFromData(); render(); pump();
  });
}
async function pump(){
  if(state.busy) return;
  state.busy = true; renderSync();
  while(state.pending.length){
    const batch = state.pending.slice();
    let ok = false, err = null;
    for(let attempt = 0; attempt < 5 && !ok; attempt++){
      try{
        state.sha = await putFile(state.repo, state.token, DATA_PATH, await encryptJSON(state.key, state.data), state.sha, batch[batch.length-1].msg);
        state.etag = null; ok = true;
      }catch(e){
        if(e.status === 409 || e.status === 422){
          try{ await loadServer(false); }catch(e2){ err = e2; if(await checkKeyChanged(e2)){ state.pending = []; state.busy = false; return; } break; }
          for(const p of state.pending){ try{ p.mut(state.data); }catch(_){} }
          syncFromData(); render();
        } else { err = e; break; }
      }
    }
    state.pending.splice(0, batch.length);
    for(const p of batch) ok ? p.resolve() : p.reject(err || new GhError(409, "conflit"));
    if(!ok){
      state.pending.forEach(p => p.reject(err)); state.pending = [];
      handleGhError(err);
      try{ await loadServer(false); syncFromData(); render(); }catch(_){}
    }
  }
  state.busy = false; state.lastSync = Date.now(); renderSync();
}
function handleGhError(e){
  const s = e && e.status;
  if(s === 401){ state.phase = "renew"; renderGate(); return; }
  if(s === 403) toast("GitHub refuse l'accès : la clé n'a peut-être pas le droit d'écrire. Vérifie ses permissions.");
  else if(s === 0) toast("Pas de connexion : la modification n'a pas été enregistrée.");
  else toast("Ça n'a pas marché, réessaie dans un instant.");
}
async function checkKeyChanged(e){
  if(!e || e.name !== "OperationError" || state.rotating) return false;
  try{
    const cfg = await fetchConfig();
    if(cfg && cfg.salt !== state.config.salt){
      LS.del(storeKey("key")); state.config = cfg; state.key = null; state.altKey = null; state.data = null;
      state.gateNote = "Le mot de passe de la coloc a changé : entre le nouveau.";
      state.phase = "login"; closeModal(); renderGate(); return true;
    }
  }catch(_){}
  return false;
}
async function poll(){
  if(state.phase !== "app" || document.hidden || state.busy || state.pending.length || state.rotating) return;
  try{
    const changed = await loadServer(true);
    state.syncError = false;
    if(changed){ syncFromData(); render(); }
  }catch(e){
    if(e.status === 401){ state.phase = "renew"; renderGate(); }
    if(await checkKeyChanged(e)) return;
    state.syncError = true;
  }
  state.lastSync = Date.now(); renderSync();
}
setInterval(poll, POLL_MS);
document.addEventListener("visibilitychange", () => { if(!document.hidden) poll(); });

/* Raccourcis d'écriture : chaque fonction s'applique sur la version la plus récente */
const findIn = (arr, id) => (arr || []).find(x => x.id === id);
const W = {
  addItem: obj => commit(d => { if(!findIn(d.items, obj.id)) d.items.push(obj); }, "ajout"),
  updItem: (id, patch) => commit(d => { const x = findIn(d.items, id); if(x) Object.assign(x, patch); }, "modif"),
  unwrap: (id, who) => commit(d => { const x = findIn(d.items, id); if(!x) return; const s = new Set(x.openedBy || []); s.add(who); x.openedBy = [...s]; }, "cadeau ouvert"),
  delItem: id => commit(d => { d.items = d.items.filter(x => x.id !== id); }, "suppression"),
  setSeen: (id, who, on) => commit(d => { const x = findIn(d.items, id); if(!x) return; const s = new Set(x.seenBy || []); on ? s.add(who) : s.delete(who); x.seenBy = [...s]; x.seenAt = {...(x.seenAt || {})}; if(on) x.seenAt[who] = Date.now(); else delete x.seenAt[who]; }, "vu"),
  setFav: (id, who, on) => commit(d => { const x = findIn(d.items, id); if(!x) return; const s = new Set(x.favBy || []); on ? s.add(who) : s.delete(who); x.favBy = [...s]; }, "favori"),
  reply: (kind, id, rep) => commit(d => { const x = findIn(kind === "list" ? d.lists : d.items, id); if(!x) return; x.replies = x.replies || []; if(!x.replies.some(r => r.id === rep.id)) x.replies.push(rep); }, "petit mot"),
  addCat: obj => commit(d => { if(!findIn(d.cats, obj.id)) d.cats.push(obj); }, "domaine"),
  updCat: (id, patch) => commit(d => { const x = findIn(d.cats, id); if(x) Object.assign(x, patch); }, "domaine"),
  delCat: id => commit(d => { d.cats = d.cats.filter(x => x.id !== id); d.lists = d.lists.filter(l => l.cat !== id); }, "domaine"),
  addList: obj => commit(d => { if(!findIn(d.lists, obj.id)) d.lists.push(obj); }, "liste"),
  updList: (id, patch) => commit(d => { const x = findIn(d.lists, id); if(x) Object.assign(x, patch); }, "liste"),
  delList: id => commit(d => { d.lists = d.lists.filter(x => x.id !== id); d.items.forEach(i => { if(i.list === id) i.list = null; }); }, "liste"),
  addMood: m => commit(d => { d.moods = d.moods || []; if(!d.moods.includes(m)) d.moods.push(m); }, "mood"),
  delMood: m => commit(d => { d.moods = (d.moods || []).filter(x => x !== m); (d.items || []).forEach(i => { if(Array.isArray(i.moods)) i.moods = i.moods.filter(x => x !== m); }); }, "mood"),
  readNotifs: (who, ts) => commit(d => { d.notifRead = {...(d.notifRead || {}), [who]: ts}; }, "notifications lues"),
  setSettings: patch => commit(d => { d.settings = {...(d.settings||{}), ...patch}; }, "réglages")
};

/* ---------- Photos chiffrées ---------- */
async function shrink(file, max){
  try{
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, (max||1600) / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.86));
  }catch(e){ return file; }
}
async function uploadPhoto(file){
  const blob = await shrink(file);
  const bytes = new Uint8Array(await blob.arrayBuffer());
  const id = uid();
  await putFile(state.repo, state.token, "photos/"+id+".enc", await encryptBytes(state.key, bytes), null, "photo");
  state.photos.set(id, URL.createObjectURL(new Blob([bytes], {type: blob.type || "image/jpeg"})));
  return id;
}
const photoTag = (id, cls, alt) => {

  return '<img class="'+cls+'" data-photo="'+esc(id)+'" alt="'+esc(alt||"")+'" draggable="false"'+(url ? ' src="'+url+'"' : '')+'>';
};

    + '<form id="renewForm"><div class="field"><label for="g-token">Nouvelle clé d\'accès</label><input type="text" id="g-token" autocomplete="off" spellcheck="false" required></div>'

const gateMsg = (t) => { const m = $("#g-msg"); if(m) m.textContent = t; };
const gateBusy = (on, label) => { const b = $("#g-go"); if(b){ b.disabled = on; if(label) b.textContent = label; } };

async function fetchConfig(){
  const res = await gh(state.repo, null, "/contents/"+CONFIG_PATH+"?ref="+DATA_BRANCH);
  if(res.status === 404) return null;
  if(!res.ok) throw new GhError(res.status);
  const j = await res.json();
  state.configSha = j.sha;
  return JSON.parse(TD.decode(unb64(j.content)));
}
async function unlock(key){
  const token = TD.decode(await decryptBytes(key, unb64(state.config.token)));
  state.key = key; state.token = token;
}
async function enterApp(){
  try{ await loadServer(false); }
  catch(e){
    if(e.status === 401){ state.phase = "renew"; renderGate(); return; }
    state.phase = "error"; state.errorMsg = "Impossible de lire le contenu (" + (e.message||e.status) + ")."; renderGate(); return;
  }
  syncFromData();
  const saved = LS.get(storeKey("me"));
  state.me = saved && people().includes(saved) ? saved : null;
  if(!state.me){ state.phase = "who"; renderGate(); return; }
  state.phase = "app"; state.route = parseHash(); render();
}
const storeKey = k => "coin."+state.repo.owner+"/"+state.repo.repo+"."+k;

async function boot(){
  state.repo = detectRepo();
  if(!state.repo){ state.phase = "norepo"; renderGate(); return; }
  renderGate();
  try{ state.config = await fetchConfig(); }
  catch(e){ state.phase = "error"; state.errorMsg = e.status === 404 ? "Dépôt introuvable : vérifie qu'il est public." : "GitHub ne répond pas. Vérifie ta connexion."; renderGate(); return; }
  if(!state.config){ state.phase = "setup"; renderGate(); return; }
  const savedKey = LS.get(storeKey("key"));
  if(savedKey){
    try{
      const key = await crypto.subtle.importKey("raw", unb64(savedKey), {name:"AES-GCM"}, true, ["encrypt","decrypt"]);
      await unlock(key); return enterApp();
    }catch(e){ LS.del(storeKey("key")); }
  }
  state.phase = "login"; renderGate();
}

document.addEventListener("submit", async e => {
  const f = e.target;
  if(f.id === "repoForm"){
    e.preventDefault();
    state.repo = {owner: $("#g-owner").value.trim(), repo: $("#g-repo").value.trim()};
    LS.set("coin.repo", JSON.stringify(state.repo)); boot(); return;
  }
  if(f.id === "loginForm"){
    e.preventDefault(); gateBusy(true, "Ouverture…"); gateMsg("");
    try{
      const key = await deriveKeyCfg($("#g-pw").value, state.config);
      await unlock(key); state.gateNote = "";
      if($("#g-remember").checked) LS.set(storeKey("key"), b64(new Uint8Array(await crypto.subtle.exportKey("raw", key))));
      enterApp();
    }catch(err){ gateBusy(false, "Entrer"); gateMsg("Mot de passe incorrect."); }
    return;
  }
  if(f.id === "setupForm"){
    e.preventDefault();
    const token = $("#g-token").value.trim(), pw = $("#g-pw").value, pw2 = $("#g-pw2").value;
    const me = $("#g-me").value.trim(), her = $("#g-her").value.trim();
    if(pw !== pw2){ gateMsg("Les deux mots de passe ne sont pas identiques."); return; }
    if(pw.length < 10){ gateMsg("Choisis un mot de passe d'au moins 10 caractères."); return; }
    gateBusy(true, "Installation…"); gateMsg("Vérification de la clé…");
    try{
      const test = await gh(state.repo, token, "");
      if(test.status === 401) throw new Error("Clé refusée par GitHub : vérifie que tu l'as copiée en entier.");
      if(!test.ok) throw new Error("La clé n'a pas accès à ce dépôt ("+test.status+").");
      gateMsg("Préparation de la branche de données…");
      await ensureBranch(state.repo, token);
      const existing = await getFile(state.repo, token, CONFIG_PATH);
      if(existing.status === 200) throw new Error("Le coin est déjà installé. Recharge la page.");
      gateMsg("Chiffrement…");
      const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
      const key = await deriveKeyCfg(pw, newKdfConfig(salt));
      const data = seedData([me, her]);
      const old = await getFile(state.repo, token, DATA_PATH);
      gateMsg("Enregistrement…");
      const sha = await putFile(state.repo, token, DATA_PATH, await encryptJSON(key, data), old.status === 200 ? old.sha : null, "installation");
      const config = {v:2, ...newKdfConfig(salt), token: b64(await encryptBytes(key, TE.encode(token))), title: DEFAULT_SETTINGS.title};
      state.configSha = await putFile(state.repo, token, CONFIG_PATH, TE.encode(JSON.stringify(config, null, 2)), null, "configuration");
      state.config = config; state.key = key; state.token = token; state.sha = sha;
      LS.set(storeKey("key"), b64(new Uint8Array(await crypto.subtle.exportKey("raw", key))));
      LS.set(storeKey("me"), me);
      enterApp();
    }catch(err){ gateBusy(false, "Installer le coin"); gateMsg(err.message || "L'installation a échoué."); }
    return;
  }
  if(f.id === "renewForm"){
    e.preventDefault(); gateBusy(true, "Enregistrement…");
    try{
      const token = $("#g-token").value.trim();
      let key = state.key;
      if(!key){ key = await deriveKeyCfg($("#g-pw").value, state.config); await decryptBytes(key, unb64(state.config.token)).catch(() => { throw new Error("Mot de passe incorrect."); }); }
      const test = await gh(state.repo, token, "");
      if(!test.ok) throw new Error("Cette clé ne fonctionne pas ("+test.status+").");
      const cfg = {...state.config, token: b64(await encryptBytes(key, TE.encode(token)))};
      const cur = await getFile(state.repo, token, CONFIG_PATH);
      state.configSha = await putFile(state.repo, token, CONFIG_PATH, TE.encode(JSON.stringify(cfg, null, 2)), cur.status === 200 ? cur.sha : null, "nouvelle clé");
      state.config = cfg; state.key = key; state.token = token;
      enterApp();
    }catch(err){ gateBusy(false, "Enregistrer la nouvelle clé"); gateMsg(err.message || "Échec."); }
    return;
  }
  if(f.id === "introForm"){
    e.preventDefault();
    const intro = $("#i-body").value.trim();
    W.setSettings({subtitle: $("#i-sub").value.trim(), intro, ...(intro !== (state.settings.intro || "") ? {introBy: state.me} : {})}).catch(() => {});
    state.editIntro = false; if(intro) state.introOpen = true; render(); return;
  }
  const rf = f.closest && f.closest("form[data-reply]");
  if(rf){
    e.preventDefault();
    const inp = rf.querySelector("input"); const text = inp.value.trim(); if(!text) return;
    const [kind, id] = rf.dataset.reply.split(":");
    inp.value = "";
    W.reply(kind, id, {id: uid(), by: state.me, text, at: Date.now()}).catch(() => {});
  }
});

function linkInfo(u, cat){
  const pod = /podcast/i.test(cat && cat.name || "");
  let url; try{ url = new URL(String(u||"").trim()); }catch(e){ return null; }
  if(!/^https?:$/.test(url.protocol)) return null;
  const h = url.hostname.replace(/^www\./,"");
  if(pod){
    const app = /spotify/.test(h) ? "Spotify" : /apple\.com$/.test(h) ? "Apple Podcasts" : /deezer/.test(h) ? "Deezer" : /youtube|youtu\.be/.test(h) ? "YouTube" : "";
    return {links:[{label: app ? "Écouter sur " + app : "Écouter", href:url.href, primary:true}]};
  }
  if(/(^|\.)spotify\.com$|^spotify\.link$|(^|\.)tidal\.com$|(^|\.)deezer\.com$|^deezer\.page\.link$|^music\.apple\.com$|^music\.youtube\.com$|(^|\.)soundcloud\.com$/.test(h))
    return {links:[{label:"Écouter dans ton appli", href:"https://song.link/"+url.href, primary:true},{label:"Lien d'origine", href:url.href}], hint:"Choisis Spotify, Tidal, Deezer… sur la page qui s'ouvre."};
  if(/(^|\.)tiktok\.com$/.test(h)) return {links:[{label:"Voir la vidéo", href:url.href, primary:true}], hint:"S'ouvre dans le navigateur, pas besoin de l'appli TikTok."};
  if(/(^|\.)youtube\.com$/.test(h) && /^\/shorts\//.test(url.pathname)) return {links:[{label:"Voir le short", href:url.href, primary:true}]};
  if(/(^|\.)youtube\.com$|^youtu\.be$/.test(h)) return {links:[{label:"Regarder sur YouTube", href:url.href, primary:true}]};
  return {links:[{label:"Ouvrir le lien", href:url.href, primary:true}]};
}

function parseHash(){
  const h = (location.hash || "").slice(1);
  if(h.startsWith("d-")) return {page:"domain", id:h.slice(2)};
  if(h.startsWith("l-")) return {page:"list", id:h.slice(2)};
  if(h === "favoris") return {page:"fav"};
  if(h === "cadeaux") return {page:"gifts"};
  if(h === "a-regarder") return {page:"watch"};
  return {page:"home"};
}
function go(route){
  state.route = route; state.mood = null;
  const h = route.page === "domain" ? "d-"+route.id : route.page === "list" ? "l-"+route.id : route.page === "fav" ? "favoris" : route.page === "gifts" ? "cadeaux" : route.page === "watch" ? "a-regarder" : "";
  if(("#"+h) !== location.hash){
    if(h) location.hash = h; else history.pushState(null, "", location.pathname + location.search);

}

    const site = siteColors();

    root.style.setProperty("--sage", site.accent); root.style.setProperty("--sage-deep", site.deep);
    body.setAttribute("style", patternCSS("pois", site, false)); return;
  }
  root.style.setProperty("--accent", th.accent); root.style.setProperty("--deep", th.deep); root.style.setProperty("--bg", th.bg);

function weekHTML(){
  const today = startOfDay(Date.now());
  const monday = today - 6 * DAY;
  let h = '<div class="week" role="list">';
  for(let i = 0; i < 7; i++){
    const t = startOfDay(monday + i * DAY + 3 * 3600000);
    const d = new Date(t);
    const its = state.items.filter(x => x.createdAt && startOfDay(x.createdAt) === t);
    const name = d.toLocaleDateString("fr-FR", {weekday:"short"}).replace(".", "").toUpperCase();
    h += '<button class="day'+(t === today ? ' today' : '')+(its.length ? '' : ' off')+(t > today ? ' future' : '')+'" data-act="day" data-t="'+t+'" role="listitem">'
      + '<span class="d"><span>'+(t === today ? "AUJ." : esc(name))+'</span><span>'+String(d.getDate()).padStart(2,"0")+'</span></span>'
      + (its.length ? '<span class="ics">'+its.slice(0,6).map(x => { const c = catById(x.cat); return '<i style="background:'+(isWrapped(x) ? "var(--accent)" : themeOf(c).deep)+'" title="'+esc(c ? c.name : "")+'">'+(isWrapped(x) ? ICONS.gift : ICONS[iconOf(c)])+'</i>'; }).join("")+(its.length > 6 ? '<b>+'+(its.length-6)+'</b>' : '')+'</span><u>'+plural(its.length, "ajout", "ajouts")+'</u>'
        : (t > today ? '' : '<u>Rien ce jour-là</u>'))
      + '</button>';
  }
  return h + '</div>';
}

function hashStr(s){ let h = 2166136261; for(const ch of String(s)){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function giftHTML(it, idx, ctx){
  const h = hashStr(it.id);
  const paper = GIFT_PAPERS[h % GIFT_PAPERS.length];
  let ribbon = GIFT_RIBBONS[(h >>> 5) % GIFT_RIBBONS.length];
  const motifs = ["pois","rayures","etoiles","coeurs","zigzag","carreaux","uni"];
  const [mImg, mSize] = giftMotifCSS(motifs[(h >>> 9) % motifs.length]);
  const band = (dir) => "linear-gradient("+dir+",transparent calc(50% - 13px),"+INK+" calc(50% - 13px),"+INK+" calc(50% - 11px),"+ribbon+" calc(50% - 11px),"+ribbon+" calc(50% + 11px),"+INK+" calc(50% + 11px),"+INK+" calc(50% + 13px),transparent calc(50% + 13px))";
  const bg = "background-color:"+paper+";background-image:"+band("90deg")+","+band("0deg")+","+mImg+";background-size:auto,auto,"+mSize;
  const delay = ((h >>> 13) % 50) / 10 + (idx % 4) * 0.7;
  return '<article class="card gift" style="--r:'+(((idx % 3) - 1) * 0.8)+'deg;--d:'+delay.toFixed(1)+'s;'+bg+'" draggable="true" data-drag="item:'+esc(it.id)+'"'
    + ((ctx === "domain" || ctx === "list") ? ' data-drop="item:'+esc(it.id)+'"' : '') + '>'
    + '<button class="gift-open" data-act="unwrap" data-id="'+esc(it.id)+'" aria-label="Ouvrir le cadeau de '+esc(it.author)+'">'
    + GIFT_BOW(ribbon) + '<span class="gift-from">de '+esc(it.author)+'</span></button></article>';
}

function guessKind(cat){
  const n = (cat && cat.name || "").toLowerCase();
  if(/s[ée]rie/.test(n)) return "tv";
  if(/film|cin[ée]/.test(n)) return "movie";
  if(/musi|album|son|playlist|chanson/.test(n)) return "music";
  if(/livre|lecture|book/.test(n)) return "ebook";
  if(/podcast/.test(n)) return "podcast";
  return "movie";
}
function jsonp(url){
  return new Promise((resolve, reject) => {
    const cb = "__coin_cb_" + uid().replace(/\W/g, "");
    const s = document.createElement("script");
    const done = () => { clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } s.remove(); };
    const t = setTimeout(() => { done(); reject(new Error("timeout")); }, 9000);
    window[cb] = data => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new Error("réseau")); };
    s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
    document.head.appendChild(s);
  });
}
const MUSIC_HOST = /(^|\.)spotify\.com$|^spotify\.link$|(^|\.)tidal\.com$|(^|\.)deezer\.com$|^deezer\.page\.link$|^music\.apple\.com$|^music\.youtube\.com$|(^|\.)soundcloud\.com$|^song\.link$|^album\.link$/;
function isMusicUrl(u){ try{ const h = new URL(String(u).trim()).hostname.replace(/^www\./, ""); return MUSIC_HOST.test(h) || (/(^|\.)youtube\.com$|^youtu\.be$/.test(h) && false); }catch(e){ return false; } }
const PLATFORMS = [["spotify","Spotify"],["tidal","Tidal"],["youtubeMusic","YouTube Music"],["youtube","YouTube"]];
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || "");
function platformOf(url){
  try{
    const h = new URL(String(url).trim()).hostname.replace(/^www\./, "");
    if(/spotify\.com$|^spotify\.link$/.test(h)) return "spotify";
    if(/(^|\.)tidal\.com$/.test(h)) return "tidal";
    if(/^music\.youtube\.com$/.test(h)) return "youtubeMusic";
    if(/(^|\.)youtube\.com$|^youtu\.be$/.test(h)) return "youtube";
  }catch(e){}
  return "";
}
function spotifyAppUri(url){
  const m = String(url).match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|album|playlist|artist|episode|show)\/([A-Za-z0-9]+)/);
  return m ? "spotify:" + m[1] + ":" + m[2] : "";
}
/* Liens vers les 4 applis, sans API externe : le lien d'origine tel quel,
   et pour les autres une recherche « titre artiste » qui ouvre directement l'appli. */
function buildMusicLinks(url, title, artist){
  const q = [title, artist].filter(Boolean).join(" ").trim();
  const origin = platformOf(url);
  const links = {};
  if(origin) links[origin] = {url: String(url).trim(), app: origin === "spotify" ? spotifyAppUri(url) : ""};
  if(!q) return links;
  const e = encodeURIComponent(q);
  if(!links.spotify) links.spotify = {url: "https://open.spotify.com/search/" + e, app: "spotify:search:" + q};
  if(!links.tidal) links.tidal = {url: "https://listen.tidal.com/search?q=" + e, app: ""};
  if(!links.youtubeMusic) links.youtubeMusic = {url: "https://music.youtube.com/search?q=" + e, app: ""};
  if(!links.youtube) links.youtube = {url: "https://www.youtube.com/results?search_query=" + e, app: ""};
  return links;
}
function splitDash(t){ const m = String(t || "").match(/^(.+?)\s+[-–—]\s+(.+)$/); return m ? {title: m[1].trim(), artist: m[2].trim()} : null; }
async function deezerFind(term){
  const j = await jsonp("https://api.deezer.com/search/track?q=" + encodeURIComponent(term) + "&limit=5&output=jsonp");
  const r = j && j.data && j.data[0];
  return r ? {title: r.title, artist: r.artist && r.artist.name || "", cover: r.album && (r.album.cover_xl || r.album.cover_big) || ""} : null;
}
async function lookupMusic(url){
  url = url.trim();
  const u = new URL(url), h = u.hostname.replace(/^www\./, "");
  let out = null;
  const dz = u.pathname.match(/\/(track|album)\/(\d+)/);
  if(/deezer\.com$/.test(h) && dz){
    const r = await jsonp("https://api.deezer.com/" + dz[1] + "/" + dz[2] + "?output=jsonp");
    out = {title: r.title || "", artist: r.artist && r.artist.name || "", cover: (r.album && (r.album.cover_xl || r.album.cover_big)) || r.cover_xl || ""};
  } else if(/^music\.apple\.com$/.test(h)){
    const id = u.searchParams.get("i") || (u.pathname.match(/\/(\d+)(?:$|\?)/) || [])[1];
    const r = id && await jsonp("https://itunes.apple.com/lookup?id=" + id + "&country=FR");
    const x = r && r.results && r.results[0];

function cardHTML(it, idx, ctx){

  if(it.photoId) h += photoTag(it.photoId, "photo", it.title || "Photo");

  if(it.artist) h += '<p class="artist">'+esc(it.artist)+'</p>';
  if(hasPlatforms) h += mbtns;
  if(isFilmItem(it) && !isWrapped(it)) h += '<div class="links"><button type="button" class="btn small trailer-btn" data-act="trailer" data-id="'+esc(it.id)+'">▶ Bande-annonce</button></div>';
  if(it.rich) h += '<div class="rich">'+richHTML(it.rich)+'</div><button type="button" class="rich-more" data-act="rich-more">Lire tout</button>';

    const seen = it.seenBy || [];

    }).join("") + '</div>';
  }
  if((it.moods||[]).length) h += '<div class="moods">' + it.moods.map(m => '<button class="chip" data-act="mood" data-m="'+esc(m)+'">'+esc(capFirst(m))+'</button>').join("") + '</div>';
  h += '<footer><span class="who">'+(it.author ? 'de '+esc(it.author)+' · ' : '')+esc(fmtDate(it.createdAt))+'</span>'
    + '<button class="icon-btn fav" data-act="fav" data-id="'+esc(it.id)+'" aria-pressed="'+!!mine+'" aria-label="'+(mine?'Retirer des favoris':'Ajouter aux favoris')+'">'+HEART+'</button>'

function openModal(html, onMount){

  const first = root.querySelector("input:not([type=file]):not([type=checkbox]),textarea,select");
  if(first) first.focus();
  if(onMount) onMount(root.querySelector(".sheet"));
  hydratePhotos();
}
function closeModal(){ $("#modalRoot").innerHTML = ""; }

function photoField(sheet, initial, saveBtnSel){
  let id = initial || null;
  const prev = sheet.querySelector(".ph-prev"), input = sheet.querySelector(".ph-input");
  if(!prev || !input) return () => id;
  const draw = () => { prev.innerHTML = id ? photoTag(id, "preview", "Aperçu") + '<button type="button" class="btn ghost ph-rm">Retirer l\'image</button>' : ''; hydratePhotos(); };
  draw();
  prev.addEventListener("click", e => { if(e.target.closest(".ph-rm")){ id = null; draw(); }});
  input.addEventListener("change", async () => {
    const f = input.files && input.files[0]; if(!f) return;
    const save = sheet.querySelector(saveBtnSel);
    if(save){ save.disabled = true; save.textContent = "Envoi de l'image…"; }
    try{ id = await uploadPhoto(f); draw(); }
    catch(e){ if(e.status === 401){ state.phase = "renew"; closeModal(); renderGate(); return; } toast("L'image n'a pas pu être envoyée. Essaie un JPEG ou un PNG."); }
    if(save){ save.disabled = false; save.textContent = "Enregistrer"; }
  });
  return () => id;
}

  openModal(html, sheet => {

    const ed = sheet.querySelector("#f-rich");

    let savedRange = null;

    ["keyup","mouseup","input","blur"].forEach(ev => ed.addEventListener(ev, keepRange));
    const restore = () => { ed.focus(); if(savedRange){ const sel = getSelection(); sel.removeAllRanges(); sel.addRange(savedRange); } };
    const insertHTML = html => { restore(); document.execCommand("insertHTML", false, html); keepRange(); };
    try{ document.execCommand("defaultParagraphSeparator", false, "p"); }catch(e){}
    const tb = sheet.querySelector(".rtb");
    tb.addEventListener("mousedown", e => { if(e.target.closest("button")) e.preventDefault(); });
    tb.addEventListener("click", e => {
      const b = e.target.closest("button[data-cmd]"); if(!b) return;
      const cmd = b.dataset.cmd;
      restore();

      else if(cmd === "imgurl"){ const u = prompt("Adresse de l'image (https://…)"); if(u && /^https:\/\//.test(u.trim())) insertHTML('<img src="'+esc(u.trim())+'" alt="" referrerpolicy="no-referrer">'); else if(u) toast("Le lien de l'image doit commencer par https://"); }
      else if(cmd === "formatBlock") document.execCommand("formatBlock", false, "<"+b.dataset.val+">");
      else if(cmd === "hiliteColor"){ if(!document.execCommand("hiliteColor", false, "#fff1a8")) document.execCommand("backColor", false, "#fff1a8"); }

    const rimg = sheet.querySelector("#f-rimg"), rhelp = sheet.querySelector("#f-rhelp");

      catch(err){ if(err.status === 401){ state.phase = "renew"; closeModal(); renderGate(); return; } rhelp.textContent = "L'image n'a pas pu être envoyée. Essaie un JPEG ou un PNG."; }

    });

    const fillFromLink = async () => {

        ttIdFound = "";
        musicFor = u; urlHelp.textContent = "Je récupère la vidéo…";

        const t = sheet.querySelector("#f-title"), a = sheet.querySelector("#f-artist");

        if(v.author && !a.value.trim()) a.value = v.author;
        if(v.id) ttIdFound = v.id;
        if(!posterUrl && v.thumb && platformOfVideo(u) === "tiktok"){ posterUrl = v.thumb; drawPoster(); }
        urlHelp.textContent = "Trouvé : " + (v.title || "la vidéo") + (v.author ? " — " + v.author : "") + (platformOfVideo(u) === "youtube" ? " · la miniature s'affiche toute seule." : "");
        return;
      }
      if(!isMusicUrl(u)) return;
      musicFor = u; urlHelp.textContent = "Je récupère le titre et l'artiste…";
      try{
        const m = await lookupMusic(u);
        if(urlField.value.trim() !== u) return;
        musicLinks = Object.keys(m.links).length ? m.links : null;
        const t = sheet.querySelector("#f-title"), a = sheet.querySelector("#f-artist");
        if(m.title) t.value = m.title;
        if(m.artist) a.value = m.artist;
        if(!posterUrl && m.cover){ posterUrl = m.cover; drawPoster(); }
        urlHelp.textContent = m.title ? "Trouvé : " + m.title + (m.artist ? " — " + m.artist : "") + (musicLinks ? " · " + PLATFORMS.filter(([p]) => musicLinks[p]).map(x => x[1]).join(", ") : "") : "Lien reconnu, mais sans informations.";
      }catch(e){ urlHelp.textContent = (platformOf(u) === "tidal" ? "Tidal ne laisse pas lire ses liens depuis un autre site. " : "Je n'ai pas pu lire ce lien. ") + "Tape le titre : je te propose la pochette, et l'artiste se remplit quand tu la choisis."; musicFor = ""; }
    };
    let linkTimer = null;
    urlField.addEventListener("input", () => { clearTimeout(linkTimer); linkTimer = setTimeout(fillFromLink, 500); });
    urlField.addEventListener("change", fillFromLink);
    const pkind = sheet.querySelector("#f-pkind"), pres = sheet.querySelector("#f-pres"), pcur = sheet.querySelector("#f-pcur");
    const artistLbl = sheet.querySelector('label[for="f-artist"]');
    const ARTIST_LBL = {music:"Artiste", album:"Artiste", song:"Artiste", ebook:"Auteur ou autrice", podcast:"Animé par", movie:"Réalisation (facultatif)", tv:"Créée par (facultatif)"};
    const setKind = () => { const c = catById(catSel.value), n = (c && c.name || ""); pkind.value = guessKind(c); artistLbl.textContent = /youtube|tiktok|vid[ée]o|short/i.test(n) ? "Créateur ou créatrice" : (ARTIST_LBL[pkind.value] || "Artiste, réalisateur, auteur…"); };
    setKind();
    catSel.addEventListener("change", setKind);
    pkind.addEventListener("change", () => { artistLbl.textContent = ARTIST_LBL[pkind.value] || artistLbl.textContent; });
    const drawPoster = () => { pcur.innerHTML = posterUrl ? '<div class="pcur"><img src="'+esc(posterUrl)+'" alt="Affiche choisie" referrerpolicy="no-referrer"><button type="button" class="btn ghost" id="f-prm">Retirer l\'affiche</button></div>' : ''; };
    drawPoster();
    pcur.addEventListener("click", e => { if(e.target.id === "f-prm"){ posterUrl = null; drawPoster(); } });
    let autoTimer = null, lastTerm = "";

    titleIn.addEventListener("input", () => {
      clearTimeout(autoTimer);
      const term = titleIn.value.trim();
      if(sheet.classList.contains("mode-text") || /youtube|tiktok|vid[ée]o|short/i.test((catById(catSel.value) || {}).name || "") || posterUrl || term.length < 3 || term === lastTerm) return;
      autoTimer = setTimeout(() => { lastTerm = term; runSearch(true); }, 700);
    });
    pkind.addEventListener("change", () => { if(titleIn.value.trim().length >= 3) runSearch(true); });
    const runSearch = async (auto) => {
      const term = titleIn.value.trim();
      if(!term){ if(!auto){ toast("Écris d'abord le titre."); titleIn.focus(); } return; }
      pres.innerHTML = '<p class="help">'+(auto ? 'Je cherche des affiches…' : 'Recherche…')+'</p>';

        pres.innerHTML = notes + (res.length ? res.map((r, i) => '<button type="button" class="pres-item" data-i="'+i+'"><img src="'+esc(r.url)+'" alt="" loading="lazy" referrerpolicy="no-referrer"><span>'+esc(r.title)+'</span><small>'+esc(r.sub)+'</small></button>').join("")
          : '<p class="help">Rien trouvé. Essaie un autre type ou une autre orthographe.</p>');
        pres.onclick = e => { const b = e.target.closest(".pres-item"); if(!b) return; const r = res[+b.dataset.i]; posterUrl = r.url; tmdbRef = r.tmdb || null; const urlIn = sheet.querySelector("#f-url"); if(r.link && urlIn && !urlIn.value.trim() && (pkind.value === "music" || pkind.value === "song" || pkind.value === "album")){ urlIn.value = r.link; fillFromLink(); } if(r.title && titleIn.value.trim().length < r.title.length && r.title.toLowerCase().includes(titleIn.value.trim().toLowerCase())) titleIn.value = r.title; const ar = sheet.querySelector("#f-artist"); if(r.artist && ar && !ar.value.trim()) ar.value = r.artist; pres.innerHTML = ""; drawPoster(); };
      }catch(err){ pres.innerHTML = '<p class="help">La recherche ne répond pas. '+(searchNotes.length ? searchNotes.map(esc).join(" ") : 'Vérifie ta connexion et réessaie.')+'</p>'; }
    };
    sheet.querySelector("#f-psearch").addEventListener("click", () => runSearch(false));
    if(preset && preset.pickPhoto){ const fi = sheet.querySelector("#f-photo"); if(fi) try{ fi.click(); }catch(e){} }
    if(editing) sheet.querySelector("#f-del").addEventListener("click", () => confirmBox("Supprimer ?", "« "+(it.title || (it.note||"").slice(0,60) || "Cet élément")+" » disparaîtra pour vous deux.", () => { W.delItem(it.id).catch(() => {}); toast("Supprimé."); }));
    sheet.querySelector("#itemForm").addEventListener("submit", e => {
      e.preventDefault();
      const data = {
        cat: catSel.value, list: listSel.value || null,
        title: sheet.querySelector("#f-title").value.trim(),
        artist: sheet.querySelector("#f-artist").value.trim(),
        links: (musicLinks && musicFor === sheet.querySelector("#f-url").value.trim()) ? musicLinks : (sheet.querySelector("#f-url").value.trim() === (it.url || "") ? (it.links || null) : null),
        url: sheet.querySelector("#f-url").value.trim(),
        note: sheet.querySelector("#f-note").value.trim(),
        why: sheet.querySelector("#f-why").value.trim(),
        moods: [...sel], photoId: getPhoto() || null, inDaily: sheet.querySelector("#f-indaily").checked, tmdb: posterUrl && tmdbRef ? tmdbRef : (posterUrl === it.posterUrl ? it.tmdb || null : null), trailer: ytId(sheet.querySelector("#f-trailer").value) ? sheet.querySelector("#f-trailer").value.trim() : null, ttId: platformOfVideo(sheet.querySelector("#f-url").value) === "tiktok" ? (tiktokIdFromUrl(sheet.querySelector("#f-url").value) || ttIdFound || null) : null, posterUrl: posterUrl || null, updatedAt: Date.now()
      };
      const richClean = sanitizeRich(ed.innerHTML);
      data.rich = (richText(richClean) || /<img/.test(richClean)) ? richClean : null;
      if(!data.title && !data.url && !data.note && !data.why && !data.photoId && !data.posterUrl && !data.rich){ toast("Ajoute au moins un titre, un lien, un mot ou une photo."); return; }
      if(editing) W.updItem(it.id, data).catch(() => {});
      else W.addItem({...data, id: uid(), createdAt: Date.now(), order: -Date.now(), author: state.me, favBy: [], replies: []}).catch(() => {});
      closeModal(); toast(editing ? "Modifié." : "Ajouté ♥");
    });
  });
}

function confirmBox(title, text, action){

function domainForm(c){

        + '<label class="sw sw-custom" aria-pressed="'+(theme==="custom")+'" style="background:'+custom+'"><input type="color" id="d-custom" value="'+custom+'" aria-label="Choisir une autre couleur"><span>Autre…</span></label>';

const customFontState = {loaded: new Set(), loading: new Set()};
function registerCustomFonts(){
  ["display","body","hand"].forEach(g => Object.keys(FONTS[g]).forEach(k => { if(k.startsWith("cf_")) delete FONTS[g][k]; }));
  (state.settings.customFonts || []).forEach(f => {
